[build]
  publish = "."
  ignore = "exit 0"

# Branch deploys (preview, staging, etc.) — always deploy
[context.branch-deploy]
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/en/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/fr/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/events/:slug"
  to = "/event.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/event.html"
  status = 200

# Rétrocompatibilité — anciennes URLs /requests/
[[redirects]]
  from = "/requests/:slug"
  to = "/events/:slug"
  status = 301

[[redirects]]
  from = "/requests"
  to = "/events"
  status = 301

[[redirects]]
  from = "/demandesspeciales"
  to = "/demandespeciale.html"
  status = 200

[[redirects]]
  from = "/demandespeciale"
  to = "/demandespeciale.html"
  status = 200

# Nouvelles URLs simplifiées — /:name_slug/:date_slug (ex: /pepouzeenterrasse/7juillet2026)
# Doit venir après toutes les routes spécifiques
[[redirects]]
  from = "/:eventslug/:dateslug"
  to = "/event.html"
  status = 200
