[build]
  publish = "."
  ignore = "exit 0"

# Branch deploys (preview, staging, etc.) — always deploy
[context.branch-deploy]
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Ancien /contact → nouvelle page /dj/contact (redirection permanente)
[[redirects]]
  from = "/en/contact"
  to = "/dj/contact"
  status = 301

[[redirects]]
  from = "/fr/contact"
  to = "/dj/contact"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/dj/contact"
  status = 301

[[redirects]]
  from = "/events/:slug"
  to = "/event.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/event.html"
  status = 200

# Rétrocompatibilité — anciennes URLs /requests/
[[redirects]]
  from = "/requests/:slug"
  to = "/events/:slug"
  status = 301

[[redirects]]
  from = "/requests"
  to = "/events"
  status = 301

# Demandes spéciales — désormais gérées via l'onglet Demandes de chaque événement.
# Anciennes URLs redirigées vers la liste des événements.
[[redirects]]
  from = "/demandesspeciales"
  to = "/events"
  status = 301

[[redirects]]
  from = "/demandespeciale"
  to = "/events"
  status = 301

# Section DJ
[[redirects]]
  from = "/dj/gigs"
  to = "/dj-gigs.html"
  status = 200

[[redirects]]
  from = "/dj/bio/:decade"
  to = "/dj-bio-decade.html"
  status = 200

[[redirects]]
  from = "/dj/bio"
  to = "/dj-bio.html"
  status = 200

[[redirects]]
  from = "/dj/reviews"
  to = "/dj-reviews.html"
  status = 200

[[redirects]]
  from = "/dj/demos"
  to = "/dj-demos.html"
  status = 200

[[redirects]]
  from = "/dj/contact"
  to = "/dj-contact.html"
  status = 200

# Fund raise — parcours caritatif (Je cours. Tu donnes. On aide.)
[[redirects]]
  from = "/jecours-tudonnes-onaide/runs"
  to = "/fund-raise-runs.html"
  status = 200

[[redirects]]
  from = "/jecours-tudonnes-onaide/donations"
  to = "/fund-raise-donations.html"
  status = 200

[[redirects]]
  from = "/jecours-tudonnes-onaide/why"
  to = "/fund-raise-why.html"
  status = 200

[[redirects]]
  from = "/jecours-tudonnes-onaide"
  to = "/fund-raise.html"
  status = 200

[[redirects]]
  from = "/dj"
  to = "/dj.html"
  status = 200

# Section School — /school (hub), /school/:section (niveau 2), /school/:section/:article (niveau 3)
# Les routes spécifiques (contact, article) doivent précéder les génériques.
[[redirects]]
  from = "/school/contact"
  to = "/school-contact.html"
  status = 200

[[redirects]]
  from = "/school/:section/:article"
  to = "/school-article.html"
  status = 200

[[redirects]]
  from = "/school/:section"
  to = "/school-section.html"
  status = 200

[[redirects]]
  from = "/school"
  to = "/school.html"
  status = 200

# Section Curator — page « coming soon »
[[redirects]]
  from = "/curator"
  to = "/curator.html"
  status = 200

# Nouvelles URLs simplifiées — /:name_slug/:date_slug (ex: /pepouzeenterrasse/7juillet2026)
# Doit venir après toutes les routes spécifiques
[[redirects]]
  from = "/:eventslug/:dateslug"
  to = "/event.html"
  status = 200

# Admin — pages détail d'événement (ex: /admin/pepouzeenterrasse/3juillet2026)
[[redirects]]
  from = "/admin/:eventslug/:dateslug"
  to = "/admin/index.html"
  status = 200
