<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigs — Momo Aux Platines</title>
  <link rel="canonical" href="https://momoauxplatines.ca/dj/gigs">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <meta property="og:title" content="Momo — Gigs">
  <meta property="og:description" content="Où Momo joue — lieux, dates, ambiances.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://momoauxplatines.ca/dj/gigs">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #000000;
      --brand-00:  #fafbf9;
      --brand-10:  #f4f6f3;
      --brand-30:  #dee4da;
      --brand-80:  #51534e;
      --brand-100: #141513;
      --brand-105: #111210;
      --gap-8:  8px;
      --gap-12: 12px;
      --gap-32: 32px;
      --gap-56: 56px;
      --font-display: 'Kalnia', serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: #fff; overflow-x: clip; -webkit-font-smoothing: antialiased; }

    .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; width: 100%; }

    /* ── Shared inner header ── */
    .site-header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      height: 112px; padding: var(--gap-32); background: var(--bg);
    }
    .hdr-back { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; color: #fff; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .hdr-logo { cursor: pointer; user-select: none; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .hdr-logo img { height: 48px; width: auto; display: block; }
    .icon { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon-back { width: 28px; height: 28px; }
    .arrow { width: 22px; height: 22px; flex-shrink: 0; }
    .arrow-sm { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Intro ── */
    .gigs-intro {
      display: flex; flex-direction: column; gap: var(--gap-56);
      padding: var(--gap-32);
    }
    .gigs-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 39px; line-height: 39px; text-transform: uppercase; color: #fff;
    }
    .gigs-sub {
      font-family: var(--font-display); font-weight: 500;
      font-size: 23px; line-height: 31px; text-transform: uppercase; color: #fff;
    }
    .gigs-sub p { margin: 0; }

    /* ── Cards ── */
    .gigs-list { flex: 1 1 auto; display: grid; grid-template-columns: 1fr; }
    .gig-card {
      display: flex; flex-direction: column; gap: var(--gap-32);
      padding: var(--gap-32);
      border-top: 0.5px solid var(--brand-80);
      margin-bottom: -0.5px;
    }
    .gig-img {
      width: 160px; height: 160px; max-width: 160px; max-height: 160px;
      object-fit: cover; display: block; background: var(--brand-100);
    }
    .gig-copy { display: flex; flex-direction: column; gap: var(--gap-12); }
    .gig-name {
      font-family: var(--font-display); font-weight: 700;
      font-size: 24px; line-height: 34px; text-transform: uppercase; color: var(--brand-30);
    }
    .gig-desc { font-family: var(--font-body); font-weight: 300; font-size: 19px; line-height: 24px; color: var(--brand-10); }
    .gig-when { display: flex; gap: var(--gap-8); font-family: var(--font-body); font-weight: 300; font-size: 19px; line-height: 24px; color: var(--brand-10); }
    .gig-when span { flex: 1 1 0; min-width: 0; }
    .gig-bottom { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-8); }
    .gig-venue { font-family: var(--font-body); font-weight: 300; font-size: 18px; line-height: 22px; color: var(--brand-00); white-space: nowrap; }
    .gig-link { display: inline-flex; align-items: center; gap: var(--gap-8); color: var(--brand-00); text-decoration: none; font-family: var(--font-body); font-weight: 300; font-size: 18px; white-space: nowrap; }

    .gigs-empty { padding: var(--gap-32); font-family: var(--font-body); font-weight: 300; font-size: 19px; color: var(--brand-10); border-top: 0.5px solid var(--brand-80); }

    /* ── Contact link (bottom) ── */
    .gigs-contact {
      display: flex; align-items: center; justify-content: space-between; gap: var(--gap-32);
      height: 80px; padding: var(--gap-8) var(--gap-32);
      border-top: 0.5px solid var(--brand-80); border-bottom: 0.5px solid var(--brand-80);
      font-family: var(--font-display); font-weight: 500; font-size: 27px; line-height: 31px;
      text-transform: uppercase; color: #fff; text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .gigs-contact:hover { background: var(--brand-105); }

    /* ── Tablet / desktop ── */
    @media (min-width: 768px) {
      .gigs-list { grid-template-columns: 1fr 1fr; }
      .gig-card:nth-child(odd) { border-right: 0.5px solid var(--brand-80); }
      .gigs-title { font-size: 48px; line-height: 48px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="hdr-back" href="/dj" aria-label="Back / Retour" title="Back / Retour">
        <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 H5 M12 5 L5 12 L12 19"/></svg>
      </a>
      <div class="hdr-logo" id="logo-toggle" role="button" tabindex="0" aria-label="Switch language / Changer de langue" title="FR / EN">
        <img src="images/logo-momo-new.svg" alt="Momo Aux Platines">
      </div>
    </header>

    <section class="gigs-intro">
      <div class="gigs-title" data-key="gigs.title" data-en="gigs" data-fr="gigs">gigs</div>
      <div class="gigs-sub">
        <p data-key="gigs.sub.1" data-en="cool places"          data-fr="des beaux lieux">cool places</p>
        <p data-key="gigs.sub.2" data-en="amazing people"       data-fr="du beau monde">amazing people</p>
        <p data-key="gigs.sub.3" data-en="good food and drinks" data-fr="bonne bouffe et bons verres">good food and drinks</p>
        <p data-key="gigs.sub.4" data-en="great music"          data-fr="de la bonne musique">great music</p>
      </div>
    </section>

    <main class="gigs-list" id="gigs-list"></main>

    <a class="gigs-contact" href="/dj/contact">
      <span data-key="gigs.contact" data-en="contact" data-fr="contact">contact</span>
      <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
    </a>

  </div>

  <script>
  let currentLang = (() => { try { return localStorage.getItem('momo-lang') || 'en'; } catch { return 'en'; } })();
  const COPY = { en: {}, fr: {} };

  function applyLang(lang) {
    const copy = COPY[lang] || {};
    document.querySelectorAll('[data-key]').forEach(el => {
      const val = copy[el.dataset.key];
      el.textContent = val !== undefined ? val
        : lang === 'fr' ? (el.dataset.fr || el.textContent)
        : (el.dataset.en || el.textContent);
    });
    document.querySelectorAll('[data-en]:not([data-key])').forEach(el => {
      el.textContent = lang === 'fr' ? (el.dataset.fr || el.textContent) : el.dataset.en;
    });
    document.documentElement.lang = lang;
    currentLang = lang;
    try { localStorage.setItem('momo-lang', lang); } catch {}
    renderGigs();
  }
  async function fetchCopy(lang) {
    try { const r = await fetch(`/api/copy?lang=${lang}`); if (r.ok) return r.json(); } catch {}
    try { const r = await fetch(`/copy/${lang}.json`); if (r.ok) return r.json(); } catch {}
    return {};
  }
  Promise.all([fetchCopy('en'), fetchCopy('fr')]).then(([en, fr]) => { COPY.en = en || {}; COPY.fr = fr || {}; applyLang(currentLang); });

  const logoToggle = document.getElementById('logo-toggle');
  function toggleLang() { applyLang(currentLang === 'fr' ? 'en' : 'fr'); }
  logoToggle.addEventListener('click', toggleLang);
  logoToggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLang(); } });

  // ── Helpers ──
  function parseDate(s) { return s ? new Date(s + 'T00:00:00') : null; }
  function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

  function formatEventDate(dateStr, lang) {
    const d = parseDate(dateStr); if (!d) return dateStr || '';
    if (lang === 'fr') {
      const m = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
      return `${d.getDate()} ${m[d.getMonth()]}`;
    }
    const m = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const day = d.getDate();
    const suf = [,'st','nd','rd'][day % 10 > 3 || Math.floor(day/10) === 1 ? 0 : day % 10] || 'th';
    return `${m[d.getMonth()]} ${day}${suf}`;
  }

  function fmt12(t) { // "18:00" -> {h:6, ap:'PM'}
    const [H, M] = t.split(':').map(Number);
    const ap = H >= 12 ? 'PM' : 'AM';
    let h = H % 12; if (h === 0) h = 12;
    return { label: M ? `${h}:${String(M).padStart(2,'0')}` : `${h}`, ap };
  }
  function formatTime(ev, lang) {
    if (!ev.start_time) return '';
    if (lang === 'fr') {
      const s = ev.start_time.replace(':00', 'h').replace(':', 'h');
      if (!ev.end_time) return s;
      const e = ev.end_time.replace(':00', 'h').replace(':', 'h');
      return `${s} à ${e}`;
    }
    const s = fmt12(ev.start_time);
    if (!ev.end_time) return `${s.label} ${s.ap}`;
    const e = fmt12(ev.end_time);
    return s.ap === e.ap ? `${s.label} to ${e.label} ${e.ap}` : `${s.label} ${s.ap} to ${e.label} ${e.ap}`;
  }

  function getLinkLabel(url) {
    if (!url) return 'Link';
    if (/instagram\.com/i.test(url)) return 'IG';
    if (/facebook\.com|fb\.com/i.test(url)) return 'FB';
    if (/youtube\.com|youtu\.be/i.test(url)) return 'YT';
    if (/twitch\.tv/i.test(url)) return 'Twitch';
    return 'Link';
  }

  function escapeHtml(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  const ARROW_SM = '<svg class="icon arrow-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>';

  function renderGigs() {
    const list = document.getElementById('gigs-list');
    if (!list) return;
    const all = (window.MOMO_EVENTS || []).filter(ev => ev.show !== false);
    const today = todayStr();
    // Upcoming + today, soonest first
    const gigs = all.filter(ev => !ev.date || ev.date >= today)
                    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    if (!gigs.length) {
      list.innerHTML = `<p class="gigs-empty" data-en="No gigs scheduled right now — check back soon." data-fr="Aucun gig pour le moment — reviens bientôt.">No gigs scheduled right now — check back soon.</p>`;
      if (currentLang === 'fr') list.querySelector('.gigs-empty').textContent = list.querySelector('.gigs-empty').dataset.fr;
      return;
    }
    list.innerHTML = '';
    gigs.forEach(ev => {
      const name    = ev.title || ev.venue || '';
      const venue   = (ev.title && ev.venue) ? ev.venue : '';
      const link    = ev.instagram || ev.link || '';
      const dateStr = formatEventDate(ev.date, currentLang);
      const timeStr = formatTime(ev, currentLang);
      const card = document.createElement('article');
      card.className = 'gig-card';
      card.innerHTML = `
        ${ev.image ? `<img class="gig-img" src="${escapeHtml(ev.image)}" alt="${escapeHtml(name)}" onerror="this.style.visibility='hidden'">`
                   : `<div class="gig-img"></div>`}
        <div class="gig-copy">
          ${name ? `<p class="gig-name">${escapeHtml(name)}</p>` : ''}
          ${ev.description ? `<p class="gig-desc">${escapeHtml(ev.description)}</p>` : ''}
          ${(dateStr || timeStr) ? `<div class="gig-when"><span>${escapeHtml(dateStr)}</span><span>${escapeHtml(timeStr)}</span></div>` : ''}
          <div class="gig-bottom">
            <span class="gig-venue">${escapeHtml(venue)}</span>
            ${link ? `<a class="gig-link" href="${escapeHtml(link)}" target="_blank" rel="noopener">${getLinkLabel(link)}${ARROW_SM}</a>` : ''}
          </div>
        </div>`;
      list.appendChild(card);
    });
  }

  fetch('/api/events')
    .then(r => r.json())
    .then(data => { window.MOMO_EVENTS = Array.isArray(data) ? data : (data.events || []); renderGigs(); })
    .catch(() => renderGigs());
  setInterval(renderGigs, 60000);

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', user => {
      if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
    });
  }
  </script>
</body>
</html>
