<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momo Aux Platines</title>
  <link rel="canonical" href="https://momoauxplatines.ca/">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <!-- Social sharing -->
  <meta property="og:title" content="Momo Aux Platines">
  <meta property="og:description" content="DJ · Montréal — gigs, demos, school, curator.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://momoauxplatines.ca/">

  <!-- Netlify Identity — handles admin invite redirects -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Fonts: Kanit (live card) + Kalnia (display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&family=Kalnia:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* ── Brand Colors — Figma: Collection "Momo" ── */
      --brand-00:  #fafbf9;
      --brand-10:  #f4f6f3;
      --brand-20:  #eaede5;
      --brand-30:  #dee4da;
      --brand-40:  #d5dccc;
      --brand-50:  #c9d3c0;
      --brand-60:  #a2a89b;
      --brand-70:  #797f73;
      --brand-80:  #51534e;
      --brand-90:  #282a27;
      --brand-95:  #20221f;
      --brand-100: #141513;
      --brand-105: #111210;
      --bg:        #000000;
      /* ── Event Colors ── */
      --red:   #d34242;
      --blue:  #007aff;
      --green: #34c759;
      --black: #000000;
      /* ── Radius ── */
      --radius-0:  0px;
      --radius-2:  2px;
      --radius-4:  4px;
      --radius-8:  8px;
      --radius-16: 16px;
      --radius-72: 72px;
      /* ── Gap ── */
      --gap-0:  0px;
      --gap-4:  4px;
      --gap-8:  8px;
      --gap-12: 12px;
      --gap-16: 16px;
      --gap-20: 20px;
      --gap-24: 24px;
      --gap-32: 32px;
      --gap-56: 56px;
      --gap-80: 80px;
      /* ── Stroke ── */
      --stroke-0: 0px;
      --stroke-05: 0.5px;
      --stroke-1: 1px;
      /* ── Avatars ── */
      --avatar-header:     40px;
      --avatar-event-card: 48px;
      --avatar-admin:      56px;
      --avatar-song-card:  64px;
      --avatar-event:      72px;
      --avatar-home:       80px;
      /* ── Effects ── */
      --shadow-blur-fields: 4px;
      /* ── Fonts (Google Fonts — hors Figma variables) ── */
      --font-display: 'Kalnia', serif;
      --font-ui: 'Kanit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: #fff;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    .home {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* ── Logo (fixed at top; click = toggle language) ── */
    .home-logo {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: flex-end;   /* right-aligned when logo is narrower than the screen */
      padding: var(--gap-32);
      background: var(--bg);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .home-logo img {
      height: 132px;
      width: auto;
      max-width: 100%;
      display: block;
    }

    /* ── Intro: live card (top) + copy (bottom) ── */
    .home-intro {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;   /* copy stays glued to the nav at the bottom */
      gap: var(--gap-32);
      padding: 0 var(--gap-32) var(--gap-32);
    }

    .live-card {
      display: none;               /* shown by JS only when a gig is live */
      margin-bottom: auto;         /* when live, card sits at top; copy stays bottom */
      align-items: center;
      gap: var(--gap-16);
      width: 100%;
      background: var(--brand-100);
      border-radius: var(--radius-8);
      padding: var(--gap-16) var(--gap-24);
      text-decoration: none;
    }
    .live-card.is-live { display: flex; }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--gap-4);
      flex-shrink: 0;
    }
    .live-dot {
      width: 12px; height: 12px;
      border-radius: var(--radius-72);
      background: var(--red);
      flex-shrink: 0;
    }
    .live-label {
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 20px;
      line-height: 26px;
      color: var(--red);
      text-transform: uppercase;
    }
    .live-venue {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      font-family: var(--font-ui);
      font-weight: 400;
      font-size: 20px;
      line-height: 22px;
      color: var(--brand-30);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .home-copy {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 28px;
      line-height: 40px;
      text-transform: uppercase;
      color: #fff;
    }
    .home-copy p { margin: 0; }

    /* ── Nav links ── */
    .home-nav { display: flex; flex-direction: column; width: 100%; }
    .home-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap-32);
      height: 80px;
      padding: var(--gap-8) var(--gap-32);
      border-top: 0.5px solid var(--brand-80);
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 27px;
      line-height: 31px;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .home-link:last-child { border-bottom: 0.5px solid var(--brand-80); }
    .home-link:hover { background: var(--brand-105); }

    /* Up-right arrow glyph (nav + live card) */
    .arrow {
      width: 22px; height: 22px;
      flex-shrink: 0;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .live-card .arrow { color: var(--brand-30); }

    /* ── Tablet / desktop ── */
    @media (min-width: 768px) {
      .home-logo { justify-content: flex-end; padding: var(--gap-32) var(--gap-32) 0; }
      .home-logo img { height: 160px; }
      .home-intro { padding: var(--gap-32) var(--gap-32) var(--gap-32); }
      .live-venue { text-align: left; }
      .home-copy { font-size: 40px; line-height: 52px; }
      .home-link { font-size: 32px; line-height: 36px; }
    }
    @media (min-width: 1024px) {
      .home-copy { font-size: 48px; line-height: 60px; }
    }
  </style>
</head>
<body>
  <main class="home" id="home">

    <!-- Logo — click/tap toggles language FR ↔ EN -->
    <div class="home-logo" id="logo-toggle" role="button" tabindex="0"
         aria-label="Switch language / Changer de langue" title="FR / EN">
      <img src="/images/logo-momo-new.svg" alt="Momo Aux Platines">
    </div>

    <div class="home-intro">
      <!-- Live gig card (populated + shown by JS when a gig is live) -->
      <a class="live-card" id="live-card" href="#">
        <span class="live-pill">
          <span class="live-dot"></span>
          <span class="live-label" data-key="nav.live" data-en="LIVE" data-fr="EN DIRECT">LIVE</span>
        </span>
        <span class="live-venue" id="live-venue"></span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>

      <div class="home-copy" id="home-copy">
        <p>he’s kind</p><p>loves music</p><p>shows how to dj</p><p>puts the vibe on</p>
      </div>
    </div>

    <nav class="home-nav">
      <a class="home-link" href="/jecours-tudonnes-onaide">
        <span data-key="home.nav.fundraise" data-en="fund raising now" data-fr="collecte en cours">fund raising now</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="home-link" href="/dj">
        <span data-key="home.nav.dj" data-en="dj" data-fr="dj">dj</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="home-link" href="/school">
        <span data-key="home.nav.school" data-en="school" data-fr="école">school</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="home-link" href="/curator">
        <span data-key="home.nav.curator" data-en="curator" data-fr="curateur">curator</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
    </nav>

  </main>

  <script>
  // ── Language ──
  let currentLang = (() => {
    try { return localStorage.getItem('momo-lang') || 'en'; } catch { return 'en'; }
  })();
  const COPY = { en: {}, fr: {} };

  function applyLang(lang) {
    const copy = COPY[lang] || {};
    document.querySelectorAll('[data-key]').forEach(el => {
      const val = copy[el.dataset.key];
      el.textContent = val !== undefined ? val
        : lang === 'fr' ? (el.dataset.fr || el.textContent)
        : (el.dataset.en || el.textContent);
    });
    document.querySelectorAll('[data-en]:not([data-key])').forEach(el => {
      el.textContent = lang === 'fr' ? (el.dataset.fr || el.textContent) : el.dataset.en;
    });
    const hc = document.getElementById('home-copy');
    const introLines = (copy['home.intro'] || '').split('|').map(s => s.trim()).filter(Boolean);
    if (hc && introLines.length) hc.innerHTML = introLines.map(l => `<p>${l.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]))}</p>`).join('');
    document.documentElement.lang = lang;
    currentLang = lang;
    try { localStorage.setItem('momo-lang', lang); } catch {}
    renderLive();
  }

  // Load copy overrides (admin-managed), then re-apply
  async function fetchCopy(lang) {
    try { const r = await fetch(`/api/copy?lang=${lang}`); if (r.ok) return r.json(); } catch {}
    try { const r = await fetch(`/copy/${lang}.json`); if (r.ok) return r.json(); } catch {}
    return {};
  }
  Promise.all([fetchCopy('en'), fetchCopy('fr')]).then(([en, fr]) => {
    COPY.en = en || {}; COPY.fr = fr || {};
    applyLang(currentLang);
  });

  // Logo toggles language
  const logoToggle = document.getElementById('logo-toggle');
  function toggleLang() { applyLang(currentLang === 'fr' ? 'en' : 'fr'); }
  logoToggle.addEventListener('click', toggleLang);
  logoToggle.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLang(); }
  });

  // ── Live gig detection (reused from the events system) ──
  function parseMins(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + (m || 0);
  }
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function eventIsLive(ev) {
    if (ev.show === false) return false;
    if (!ev.date || !ev.start_time) return false;
    const now = new Date();
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const today = todayStr();
    const start = parseMins(ev.start_time);
    const end   = parseMins(ev.end_time);
    if (end === null) return ev.date === today && nowMins >= start;
    const overnight = start > end;
    if (overnight) {
      const nextDay = new Date(ev.date + 'T00:00:00');
      nextDay.setDate(nextDay.getDate() + 1);
      const nextDayStr = nextDay.toISOString().slice(0,10);
      return (ev.date === today && nowMins >= start) || (nextDayStr === today && nowMins < end);
    }
    return ev.date === today && nowMins >= start && nowMins < end;
  }

  const _EM = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const _FM = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  function buildEventUrl(ev, lang) {
    if (ev.name_slug && ev.date) {
      const p = ev.date.split('-');
      const day = parseInt(p[2]); const mi = parseInt(p[1]) - 1; const yr = p[0];
      const dp = lang === 'fr' ? `${day}${_FM[mi]}${yr}` : `${_EM[mi]}${day}${yr}`;
      return `/${ev.name_slug}/${dp}`;
    }
    return ev.slug ? '/events/' + encodeURIComponent(ev.slug) : '/events';
  }

  function renderLive() {
    const all  = window.MOMO_EVENTS || [];
    const live = all.filter(eventIsLive);
    const card = document.getElementById('live-card');
    if (!card) return;
    if (!live.length) { card.classList.remove('is-live'); return; }
    const ev = live[0];
    document.getElementById('live-venue').textContent = ev.venue || '';
    card.href = buildEventUrl(ev, currentLang);
    card.classList.add('is-live');
  }

  fetch('/api/events')
    .then(r => r.json())
    .then(data => { window.MOMO_EVENTS = Array.isArray(data) ? data : (data.events || []); renderLive(); })
    .catch(() => renderLive());

  // Re-check every minute (card auto-hides when the window closes)
  setInterval(renderLive, 60000);

  // ── Netlify Identity — redirect to admin after login via invite link ──
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', user => {
      if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
    });
  }
  </script>
</body>
</html>
