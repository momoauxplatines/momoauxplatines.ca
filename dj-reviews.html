<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews — Momo Aux Platines</title>
  <link rel="canonical" href="https://momoauxplatines.ca/dj/reviews">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <meta property="og:title" content="Momo — Reviews">
  <meta property="og:description" content="Ce qu'ils disent de Momo.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://momoauxplatines.ca/dj/reviews">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #000000;
      --brand-00:  #fafbf9;
      --brand-30:  #dee4da;
      --brand-80:  #51534e;
      --brand-100: #141513;
      --brand-105: #111210;
      --gap-8:  8px;
      --gap-20: 20px;
      --gap-32: 32px;
      --gap-56: 56px;
      --font-display: 'Kalnia', serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: #fff; overflow-x: clip; -webkit-font-smoothing: antialiased; }
    .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; width: 100%; }

    .site-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; height: 112px; padding: var(--gap-32); background: var(--bg); }
    .hdr-back { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; color: #fff; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .hdr-logo { cursor: pointer; user-select: none; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .hdr-logo img { height: 48px; width: auto; display: block; }
    .icon { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon-back { width: 28px; height: 28px; }
    .arrow { width: 22px; height: 22px; flex-shrink: 0; }
    .arrow-sm { width: 16px; height: 16px; flex-shrink: 0; }

    .rv-intro { display: flex; flex-direction: column; gap: var(--gap-56); padding: var(--gap-32); }
    .rv-title { font-family: var(--font-display); font-weight: 700; font-size: 39px; line-height: 39px; text-transform: uppercase; color: #fff; }
    .rv-sub { font-family: var(--font-display); font-weight: 500; font-size: 23px; line-height: 31px; text-transform: uppercase; color: #fff; }
    .rv-sub p { margin: 0; }

    .rv-list { flex: 1 1 auto; display: grid; grid-template-columns: 1fr; }
    .rv-card { display: flex; flex-direction: column; gap: var(--gap-20); padding: var(--gap-32); border-top: 0.5px solid var(--brand-80); margin-bottom: -0.5px; }
    .rv-avatar { width: 80px; height: 80px; object-fit: cover; display: block; background: var(--brand-100); border-radius: 50%; }
    .rv-copy { display: flex; flex-direction: column; gap: var(--gap-8); color: var(--brand-30); }
    .rv-name { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 34px; text-transform: uppercase; }
    .rv-venue { font-family: var(--font-body); font-weight: 700; font-size: 18px; line-height: 1.2; }
    .rv-text { font-family: var(--font-body); font-weight: 300; font-size: 18px; line-height: 22px; }
    .rv-bottom { display: flex; align-items: center; justify-content: flex-end; }
    .rv-link { display: inline-flex; align-items: center; gap: var(--gap-8); color: var(--brand-00); text-decoration: none; font-family: var(--font-body); font-weight: 300; font-size: 18px; white-space: nowrap; }
    .rv-empty { padding: var(--gap-32); font-family: var(--font-body); font-weight: 300; font-size: 19px; color: var(--brand-00); border-top: 0.5px solid var(--brand-80); }

    .rv-contact {
      display: flex; align-items: center; justify-content: space-between; gap: var(--gap-32);
      height: 80px; padding: var(--gap-8) var(--gap-32);
      border-top: 0.5px solid var(--brand-80); border-bottom: 0.5px solid var(--brand-80);
      font-family: var(--font-display); font-weight: 500; font-size: 27px; line-height: 31px;
      text-transform: uppercase; color: #fff; text-decoration: none; transition: background-color 0.15s ease;
    }
    .rv-contact:hover { background: var(--brand-105); }

    @media (min-width: 768px) {
      .rv-list { grid-template-columns: 1fr 1fr; }
      .rv-card:nth-child(odd) { border-right: 0.5px solid var(--brand-80); }
      .rv-title { font-size: 48px; line-height: 48px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="hdr-back" href="/dj" aria-label="Back / Retour" title="Back / Retour">
        <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 H5 M12 5 L5 12 L12 19"/></svg>
      </a>
      <div class="hdr-logo" id="logo-toggle" role="button" tabindex="0" aria-label="Switch language / Changer de langue" title="FR / EN">
        <img src="/images/logo-momo-new.svg" alt="Momo Aux Platines">
      </div>
    </header>

    <section class="rv-intro">
      <div class="rv-title" data-key="reviews.title" data-en="reviews" data-fr="avis">reviews</div>
      <div class="rv-sub">
        <p data-key="reviews.sub.1" data-en="dj is sharing"                   data-fr="le dj partage">dj is sharing</p>
        <p data-key="reviews.sub.2" data-en="we shared moments"               data-fr="on a partagé des moments">we shared moments</p>
        <p data-key="reviews.sub.3" data-en="here are their thoughts on those" data-fr="voici ce qu'ils en pensent">here are their thoughts on those</p>
      </div>
    </section>

    <main class="rv-list" id="rv-list"></main>

    <a class="rv-contact" href="/dj/contact">
      <span data-key="reviews.contact" data-en="contact" data-fr="contact">contact</span>
      <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
    </a>

  </div>

  <script>
  let currentLang = (() => { try { return localStorage.getItem('momo-lang') || 'en'; } catch { return 'en'; } })();
  const COPY = { en: {}, fr: {} };

  function applyLang(lang) {
    const copy = COPY[lang] || {};
    document.querySelectorAll('[data-key]').forEach(el => {
      const val = copy[el.dataset.key];
      el.textContent = val !== undefined ? val : lang === 'fr' ? (el.dataset.fr || el.textContent) : (el.dataset.en || el.textContent);
    });
    document.documentElement.lang = lang; currentLang = lang;
    try { localStorage.setItem('momo-lang', lang); } catch {}
    renderReviews();
  }
  async function fetchCopy(lang) {
    try { const r = await fetch(`/api/copy?lang=${lang}`); if (r.ok) return r.json(); } catch {}
    try { const r = await fetch(`/copy/${lang}.json`); if (r.ok) return r.json(); } catch {}
    return {};
  }
  Promise.all([fetchCopy('en'), fetchCopy('fr')]).then(([en, fr]) => { COPY.en = en || {}; COPY.fr = fr || {}; applyLang(currentLang); });

  const logoToggle = document.getElementById('logo-toggle');
  function toggleLang() { applyLang(currentLang === 'fr' ? 'en' : 'fr'); }
  logoToggle.addEventListener('click', toggleLang);
  logoToggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLang(); } });

  function escapeHtml(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const ARROW_SM = '<svg class="icon arrow-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>';

  function renderReviews() {
    const copy = COPY[currentLang] || COPY.en || {};
    const list = document.getElementById('rv-list');
    const registry = (copy['reviews.registry'] || '').split('|').filter(Boolean).reverse(); // newest first
    if (!registry.length) {
      list.innerHTML = `<p class="rv-empty">${currentLang === 'fr' ? 'Pas encore d’avis.' : 'No reviews yet.'}</p>`;
      return;
    }
    list.innerHTML = '';
    registry.forEach(id => {
      const name  = copy[`reviews.${id}.name`]      || id;
      const venue = copy[`reviews.${id}.venue`]     || '';
      const text  = copy[`reviews.${id}.text`]      || '';
      const link  = copy[`reviews.${id}.instagram`] || '';
      const avatar= copy[`reviews.${id}.avatar`]    || '';
      const card = document.createElement('article');
      card.className = 'rv-card';
      card.innerHTML = `
        ${avatar ? `<img class="rv-avatar" src="${escapeHtml(avatar)}" alt="${escapeHtml(name)}" onerror="this.style.visibility='hidden'">` : `<div class="rv-avatar"></div>`}
        <div class="rv-copy">
          <p class="rv-name">${escapeHtml(name)}</p>
          ${venue ? `<p class="rv-venue">${escapeHtml(venue)}</p>` : ''}
          ${text ? `<p class="rv-text">${escapeHtml(text)}</p>` : ''}
        </div>
        ${link ? `<div class="rv-bottom"><a class="rv-link" href="${escapeHtml(link)}" target="_blank" rel="noopener">Instagram${ARROW_SM}</a></div>` : ''}`;
      list.appendChild(card);
    });
  }

  if (window.netlifyIdentity) { window.netlifyIdentity.on('init', user => { if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; }); }); }
</script>
</body>
</html>
