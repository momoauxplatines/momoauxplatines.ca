<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio — Momo Aux Platines</title>
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #000000;
      --brand-00:  #fafbf9;
      --brand-30:  #dee4da;
      --brand-80:  #51534e;
      --brand-100: #141513;
      --brand-105: #111210;
      --gap-8:  8px;
      --gap-20: 20px;
      --gap-32: 32px;
      --gap-56: 56px;
      --font-display: 'Kalnia', serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: #fff; overflow-x: clip; -webkit-font-smoothing: antialiased; }
    .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; width: 100%; }

    .site-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; height: 112px; padding: var(--gap-32); background: var(--bg); }
    .hdr-back { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; color: #fff; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .hdr-logo { cursor: pointer; user-select: none; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .hdr-logo img { height: 48px; width: auto; display: block; }
    .icon { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon-back { width: 28px; height: 28px; }
    .arrow { width: 22px; height: 22px; flex-shrink: 0; }
    .arrow-sm { width: 16px; height: 16px; flex-shrink: 0; }

    .bio-intro { display: flex; flex-direction: column; gap: var(--gap-56); padding: var(--gap-32); }
    .bio-decade { font-family: var(--font-display); font-weight: 700; font-size: 39px; line-height: 39px; text-transform: uppercase; color: #fff; }
    .bio-tagline { font-family: var(--font-display); font-weight: 500; font-size: 23px; line-height: 31px; text-transform: uppercase; color: #fff; }
    .bio-tagline p { margin: 0; }

    .bio-list { flex: 1 1 auto; display: grid; grid-template-columns: 1fr; }
    .bio-card {
      display: flex; flex-direction: column; gap: var(--gap-20);
      padding: var(--gap-32);
      border-top: 0.5px solid var(--brand-80); margin-bottom: -0.5px;
    }
    .bio-thumb { width: 80px; height: 80px; object-fit: cover; display: block; background: var(--brand-100); }
    .bio-card-copy { display: flex; flex-direction: column; gap: var(--gap-8); }
    .bio-name { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 34px; text-transform: uppercase; color: var(--brand-30); }
    .bio-desc { font-family: var(--font-body); font-weight: 300; font-size: 19px; line-height: 24px; color: var(--brand-00); }
    .bio-bottom { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-8); }
    .bio-dates { font-family: var(--font-body); font-weight: 300; font-size: 18px; line-height: 22px; color: var(--brand-00); white-space: nowrap; }
    .bio-cardlink { display: inline-flex; align-items: center; gap: var(--gap-8); color: var(--brand-00); text-decoration: none; font-family: var(--font-body); font-weight: 300; font-size: 18px; white-space: nowrap; }
    .bio-empty { padding: var(--gap-32); font-family: var(--font-body); font-weight: 300; font-size: 19px; color: var(--brand-00); border-top: 0.5px solid var(--brand-80); }

    .bio-contact {
      display: flex; align-items: center; justify-content: space-between; gap: var(--gap-32);
      height: 80px; padding: var(--gap-8) var(--gap-32);
      border-top: 0.5px solid var(--brand-80); border-bottom: 0.5px solid var(--brand-80);
      font-family: var(--font-display); font-weight: 500; font-size: 27px; line-height: 31px;
      text-transform: uppercase; color: #fff; text-decoration: none; transition: background-color 0.15s ease;
    }
    .bio-contact:hover { background: var(--brand-105); }

    @media (min-width: 768px) {
      .bio-list { grid-template-columns: 1fr 1fr; }
      .bio-card:nth-child(odd) { border-right: 0.5px solid var(--brand-80); }
      .bio-decade { font-size: 48px; line-height: 48px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="hdr-back" href="/dj/bio" aria-label="Back / Retour" title="Back / Retour">
        <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 H5 M12 5 L5 12 L12 19"/></svg>
      </a>
      <div class="hdr-logo" id="logo-toggle" role="button" tabindex="0" aria-label="Switch language / Changer de langue" title="FR / EN">
        <img src="/images/logo-momo-new.svg" alt="Momo Aux Platines">
      </div>
    </header>

    <section class="bio-intro">
      <div class="bio-decade" id="bio-decade"></div>
      <div class="bio-tagline" id="bio-tagline"></div>
    </section>

    <main class="bio-list" id="bio-list"></main>

    <a class="bio-contact" href="/dj/contact">
      <span data-key="bio.contact" data-en="contact" data-fr="contact">contact</span>
      <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
    </a>

  </div>

  <script>
  // Decade from URL: /dj/bio/1990 -> "1990"
  const DECADE = (() => {
    const m = location.pathname.match(/\/dj\/bio\/(\d{4})/);
    return m ? m[1] : '1990';
  })();
  document.getElementById('bio-decade').textContent = DECADE;
  document.title = `Bio ${DECADE} — Momo Aux Platines`;

  let currentLang = (() => { try { return localStorage.getItem('momo-lang') || 'en'; } catch { return 'en'; } })();
  const COPY = { en: {}, fr: {} };

  function applyLang(lang) {
    const copy = COPY[lang] || {};
    document.querySelectorAll('[data-key]').forEach(el => {
      const val = copy[el.dataset.key];
      el.textContent = val !== undefined ? val : lang === 'fr' ? (el.dataset.fr || el.textContent) : (el.dataset.en || el.textContent);
    });
    document.documentElement.lang = lang; currentLang = lang;
    try { localStorage.setItem('momo-lang', lang); } catch {}
    renderBio();
  }
  async function fetchCopy(lang) {
    try { const r = await fetch(`/api/copy?lang=${lang}`); if (r.ok) return r.json(); } catch {}
    try { const r = await fetch(`/copy/${lang}.json`); if (r.ok) return r.json(); } catch {}
    return {};
  }
  Promise.all([fetchCopy('en'), fetchCopy('fr')]).then(([en, fr]) => { COPY.en = en || {}; COPY.fr = fr || {}; applyLang(currentLang); });

  const logoToggle = document.getElementById('logo-toggle');
  function toggleLang() { applyLang(currentLang === 'fr' ? 'en' : 'fr'); }
  logoToggle.addEventListener('click', toggleLang);
  logoToggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLang(); } });

  function startYear(s) { const m = (s || '').match(/(\d{4})/); return m ? parseInt(m[1], 10) : 0; }
  function linkLabel(url) {
    if (!url) return '';
    if (/instagram\.com/i.test(url)) return 'Instagram';
    if (/youtube\.com|youtu\.be/i.test(url)) return 'YouTube';
    if (/twitch\.tv/i.test(url)) return 'Twitch';
    if (/tiktok\.com/i.test(url)) return 'TikTok';
    if (/facebook\.com/i.test(url)) return 'Facebook';
    if (/soundcloud\.com/i.test(url)) return 'SoundCloud';
    if (/spotify\.com/i.test(url)) return 'Spotify';
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return 'Link'; }
  }
  function escapeHtml(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const ARROW_SM = '<svg class="icon arrow-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>';

  function renderBio() {
    const copy = COPY[currentLang] || COPY.en || {};

    // Optional per-decade tagline (pipe-separated), editable later via copy key
    const tagEl = document.getElementById('bio-tagline');
    const tagline = copy[`timeline.${DECADE}.tagline`] || '';
    tagEl.innerHTML = tagline ? tagline.split('|').map(l => `<p>${escapeHtml(l.trim())}</p>`).join('') : '';

    const list = document.getElementById('bio-list');
    const registry = (copy[`timeline.${DECADE}.registry`] || '').split('|').filter(Boolean);
    const cards = registry.map(id => ({
      id,
      name:  copy[`timeline.${id}.name`]      || id,
      desc:  copy[`timeline.${id}.desc`]      || '',
      dates: copy[`timeline.${id}.dates`]     || '',
      image: copy[`timeline.${id}.avatar`]    || '',
      link:  copy[`timeline.${id}.instagram`] || '',
    })).sort((a, b) => startYear(a.dates) - startYear(b.dates));

    if (!cards.length) {
      list.innerHTML = `<p class="bio-empty">${currentLang === 'fr' ? 'Rien pour cette décennie pour l’instant.' : 'Nothing for this decade yet.'}</p>`;
      return;
    }
    list.innerHTML = '';
    cards.forEach(c => {
      const label = linkLabel(c.link);
      const card = document.createElement('article');
      card.className = 'bio-card';
      card.innerHTML = `
        ${c.image ? `<img class="bio-thumb" src="${escapeHtml(c.image)}" alt="${escapeHtml(c.name)}" onerror="this.style.visibility='hidden'">` : `<div class="bio-thumb"></div>`}
        <div class="bio-card-copy">
          <p class="bio-name">${escapeHtml(c.name)}</p>
          ${c.desc ? `<p class="bio-desc">${escapeHtml(c.desc)}</p>` : ''}
        </div>
        <div class="bio-bottom">
          <span class="bio-dates">${escapeHtml(c.dates)}</span>
          ${c.link ? `<a class="bio-cardlink" href="${escapeHtml(c.link)}" target="_blank" rel="noopener">${escapeHtml(label)}${ARROW_SM}</a>` : ''}
        </div>`;
      list.appendChild(card);
    });
  }

  if (window.netlifyIdentity) { window.netlifyIdentity.on('init', user => { if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; }); }); }
</script>
</body>
</html>
