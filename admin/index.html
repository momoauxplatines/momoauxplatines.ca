  // ── BATTLE tab ────────────────────────────────────────────────────────────────
  const SPOTIFY_CLIENT_ID     = '20fd4c8184404ca6ac11da2f123cf2e9';
  const SPOTIFY_CLIENT_SECRET = 'aca3231685184876977a605978ebb368';

  let battleSongs    = [];   // [{title, artist, image, url}]
  let battleDuration = 900;  // seconds, default 15 min
  let battleSpotifyTimer = null;
  let battleSelectedIds  = new Set(); // request IDs selected for battle from requests tab
  let _battleFromRequests = false;    // true when battle form was launched from requests tab

  function parseSpotifyId(url) {
    const m = (url || '').match(/spotify\.com\/track\/([a-zA-Z0-9]+)/);
    return m ? m[1] : null;
  }

  async function getSpotifyToken() {
    const cached = sessionStorage.getItem('sp_token');
    const expiry = parseInt(sessionStorage.getItem('sp_expiry') || '0');
    if (cached && Date.now() < expiry) return cached;
    const resp = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'Authorization': 'Basic ' + btoa(SPOTIFY_CLIENT_ID + ':' + SPOTIFY_CLIENT_SECRET)
      },
      body: 'grant_type=client_credentials'
    });
    const data = await resp.json();
    if (!data.access_token) throw new Error('Token error');
    sessionStorage.setItem('sp_token', data.access_token);
    sessionStorage.setItem('sp_expiry', String(Date.now() + (data.expires_in - 60) * 1000));
    return data.access_token;
  }

  const TRACK_DEFAULT_IMAGE = '../images/track-default.svg';

  async function fetchItunesImage(title, artist) {
    try {
      const q = encodeURIComponent([artist, title].filter(Boolean).join(' '));
      const resp = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&limit=1`);
      if (!resp.ok) return null;
      const data = await resp.json();
      const art = data.results?.[0]?.artworkUrl100;
      return art ? art.replace('100x100bb', '600x600bb') : null;
    } catch { return null; }
  }

  // Unified track info — Battle (spotifyUrl) and Playing (artist + title)
  async function fetchTrackInfo({ spotifyUrl = null, artist = '', title = '' } = {}) {
    if (spotifyUrl) {
      const trackId = parseSpotifyId(spotifyUrl);
      if (trackId) {
        try {
          const spTok = await getSpotifyToken();
          const resp  = await fetch(`https://api.spotify.com/v1/tracks/${trackId}`, {
            headers: { Authorization: `Bearer ${spTok}` }
          });
          if (resp.ok) {
            const d = await resp.json();
            const spArtist = d.artists.map(a => a.name).join(', ');
            const spTitle  = d.name;
            const spImage  = d.album.images[0]?.url
              || await fetchItunesImage(spTitle, spArtist)
              || TRACK_DEFAULT_IMAGE;
            return { title: spTitle, artist: spArtist, image: spImage, url: d.external_urls.spotify };
          }
        } catch {}
        try {
          const oe = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(spotifyUrl)}&format=json`);
          if (oe.ok) {
            const d = await oe.json();
            const oeImage = d.thumbnail_url || await fetchItunesImage(d.title || '', '') || TRACK_DEFAULT_IMAGE;
            return { title: d.title || '', artist: '', image: oeImage, url: spotifyUrl };
          }
        } catch {}
      }
    }
    const itunesImage = (artist || title) ? await fetchItunesImage(title, artist) : null;
    return { title, artist, image: itunesImage || TRACK_DEFAULT_IMAGE, url: spotifyUrl || '' };
  }

  function secondsToHMS(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return [
      h   ? String(h).padStart(2,'0')   : '00',
      String(m).padStart(2,'0'),
      String(sec).padStart(2,'0')
    ].join(':');
  }

  function hmsToSeconds(str) {
    const parts = (str || '').split(':').map(Number);
    if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
    if (parts.length === 2) return (parts[0] * 60) + parts[1];
    return parseInt(str) || 0;
  }

  async function loadBattle() {
    reqBody.innerHTML = '<div class="empty-state">Loading…</div>';

    if (!reqEventIsLive) {
      reqBody.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'req-empty-body';
      wrap.innerHTML = `<p>${t('battle.not.live')}</p>`;
      reqBody.appendChild(wrap);
      const footer = document.getElementById('req-footer');
      if (footer) footer.innerHTML = `<button class="battle-start-btn" disabled>${t('battle.start.btn')}</button>`;
      return;
    }

    const slug = currentEvents[reqEventIdx]?.slug || '';
    const qs   = slug ? `?event=${encodeURIComponent(slug)}` : '';
    try {
      const res = await fetch(`/api/battles${qs}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const battles = await res.json();
      // Find an active battle (if any)
      const activeBattle = battles.find(b => b.status === 'active');
      if (activeBattle) {
        renderActiveBattle(activeBattle);
      } else {
        renderBattleForm();
      }
    } catch (e) {
      reqBody.innerHTML = `<div class="empty-state" style="color:var(--red)">Failed: ${e.message}</div>`;

  let _battleCountdown = null;
  let _battlePoll      = null;
  let _activeBattle    = null; // the battle object currently displayed

  function stopBattleTimers() {
    clearInterval(_battleCountdown);
    clearInterval(_battlePoll);
    _battleCountdown = null;
    _battlePoll      = null;
  }

  // Compute per-song vote percentages from battle.votes object
  function computeVotePcts(battle) {
    const votes  = battle.votes || {};
    const totals = battle.songs.map(s => votes[s.id] || 0);
    const total  = totals.reduce((a, b) => a + b, 0);
    const maxVotes = Math.max(...totals, 0);
    return battle.songs.map((s, i) => ({
      song:    s,
      count:   totals[i],
      pct:     total > 0 ? Math.round((totals[i] / total) * 100) : 0,
      leading: totals[i] === maxVotes && maxVotes > 0,
    }));
  }

  function buildBattleLiveCard(entry) {
    const colorClass = entry.leading ? 'leading' : 'behind';
    const fillPct    = entry.pct;
    return `
      <div class="battle-live-card">
        <img class="battle-live-art" src="${escReq(entry.song.image)}" alt="" onerror="this.style.background='var(--brand-90)'">
        <div class="battle-live-body">
          <p class="battle-live-title">${escReq(entry.song.title)}</p>
          ${entry.song.artist ? `<p class="battle-live-artist">${escReq(entry.song.artist)}</p>` : ''}
          <div class="battle-vote-row">
            <div class="battle-vote-bar">
              <div class="battle-vote-fill ${colorClass}" style="width:${fillPct}%"></div>
              <div class="battle-vote-empty"></div>
            </div>
            <p class="battle-vote-pct">${fillPct}%</p>
          </div>
        </div>
      </div>`;
  }

  function renderActiveBattle(battle) {
    stopBattleTimers();
    _activeBattle = battle;

    const isEnded = battle.status === 'ended' ||
                    (battle.started_at && (Date.now() - battle.started_at) / 1000 >= battle.duration);

    reqBody.innerHTML = '';
    const footer = document.getElementById('req-footer');

    // ── Footer: "Create New Battle" ──────────────────────────────────────────
    footer.innerHTML = `<button class="battle-new-btn" id="battle-new-btn" ${isEnded ? '' : 'disabled'}>${t('battle.new.btn')}</button>`;
    document.getElementById('battle-new-btn').addEventListener('click', () => {
      stopBattleTimers();
      battleSongs    = [];
      battleDuration = 900;
      // Restore normal footer
      document.getElementById('req-footer').innerHTML = `<button class="btn-dark" id="req-refresh-btn">${t('btn.refresh')}</button>`;
      renderBattleForm();
    });

    // ── Status label ─────────────────────────────────────────────────────────
    const statusEl = document.createElement('p');
    statusEl.className = 'battle-status-label ' + (isEnded ? 'ended' : 'active');
    statusEl.id = 'battle-status-label';
    statusEl.textContent = isEnded ? t('battle.status.ended') : t('battle.status.remaining') + ' ' + secondsToHMS(
      Math.max(0, battle.duration - Math.floor((Date.now() - battle.started_at) / 1000))
    );
    reqBody.appendChild(statusEl);

    // ── Song list ────────────────────────────────────────────────────────────
    const songsWrap = document.createElement('div');
    songsWrap.className = 'battle-live-songs';
    songsWrap.id = 'battle-live-songs';
    const entries = computeVotePcts(battle);
    songsWrap.innerHTML = entries.map(buildBattleLiveCard).join('');
    reqBody.appendChild(songsWrap);

    if (isEnded) return; // no timers needed

    // ── Countdown (1s tick) ──────────────────────────────────────────────────
    _battleCountdown = setInterval(() => {
      const label = document.getElementById('battle-status-label');
      if (!label || !_activeBattle) return;
      const elapsed   = Math.floor((Date.now() - _activeBattle.started_at) / 1000);
      const remaining = Math.max(0, _activeBattle.duration - elapsed);
      if (remaining === 0) {
        // Time's up — flip to ended locally, then let next poll confirm
        label.textContent = t('battle.status.ended');
        label.className   = 'battle-status-label ended';
        const newBtn = document.getElementById('battle-new-btn');
        if (newBtn) newBtn.disabled = false;
        stopBattleTimers();
      } else {
        label.textContent = t('battle.status.remaining') + ' ' + secondsToHMS(remaining);
      }
    }, 1000);

    // ── Vote poll (5s) ───────────────────────────────────────────────────────
    _battlePoll = setInterval(async () => {
      if (liveActiveTab !== 'battle') return;
      const slug = currentEvents[reqEventIdx]?.slug || '';
      const qs   = slug ? `?event=${encodeURIComponent(slug)}` : '';
      try {
        const res     = await fetch(`/api/battles${qs}`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) return;
        const battles = await res.json();
        const updated = battles.find(b => b.id === _activeBattle.id);
        if (!updated) return;
        _activeBattle = updated;

        // Re-render vote bars in-place
        const songsDiv = document.getElementById('battle-live-songs');
        if (songsDiv) songsDiv.innerHTML = computeVotePcts(updated).map(buildBattleLiveCard).join('');

        // If server says ended, flip the UI
        if (updated.status === 'ended') {
          const label = document.getElementById('battle-status-label');
          if (label) { label.textContent = t('battle.status.ended'); label.className = 'battle-status-label ended'; }
          const newBtn = document.getElementById('battle-new-btn');
          if (newBtn) newBtn.disabled = false;
          stopBattleTimers();
        }
      } catch { /* silent */ }
    }, 5000);
  }

  function renderBattleForm() {
    reqBody.innerHTML = '';
    const form = document.createElement('div');
    form.className = 'battle-form';

    // Duration field
    const durOptions = [
      { val: 300, label: '5 minutes' },
      { val: 900, label: '15 minutes' },
      { val: 1800, label: '30 minutes' },
    ];
    const currentDur = [300, 900, 1800].includes(battleDuration) ? battleDuration : 900;
    form.innerHTML = `
      <div class="battle-field">
        <label class="battle-label">${t('battle.time.label')}</label>
        <select class="battle-input" id="battle-duration-input">
          ${durOptions.map(o => `<option value="${o.val}"${o.val === currentDur ? ' selected' : ''}>${o.label}</option>`).join('')}
        </select>
      </div>
      <div class="battle-field">
        <label class="battle-label">${t('battle.songs.label')} <span class="battle-count-hint" id="battle-count-hint">(${battleSongs.length}/5)</span></label>
        <div class="battle-spotify-wrap">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/>
            <path d="M14.5 14.5L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input class="battle-spotify-input" id="battle-spotify-input"
                 type="text" placeholder="${t('battle.spotify.placeholder')}"
                 ${battleSongs.length >= 5 ? 'disabled' : ''}>
        </div>
        <p class="battle-spotify-status" id="battle-spotify-status"></p>
      </div>
      <div class="battle-songs-list" id="battle-songs-list"></div>
      <button class="battle-start-btn" id="battle-start-btn" disabled>${t('battle.start.btn')}</button>`;

    reqBody.appendChild(form);

    // Render existing songs
    renderBattleSongsList();

    // Duration input handler
    const durInput = document.getElementById('battle-duration-input');
    battleDuration = parseInt(durInput.value);
    durInput.addEventListener('change', () => {
      battleDuration = parseInt(durInput.value);
      updateBattleStartBtn();
    });

    // Spotify input: debounce 600ms then lookup
    const spInput  = document.getElementById('battle-spotify-input');
    const spStatus = document.getElementById('battle-spotify-status');
    spInput.addEventListener('input', () => {
      clearTimeout(battleSpotifyTimer);
      const val = spInput.value.trim();
      if (!val) { spStatus.textContent = ''; spStatus.className = 'battle-spotify-status'; return; }
      if (!parseSpotifyId(val)) {
        spStatus.textContent = t('battle.spotify.invalid');
        spStatus.className = 'battle-spotify-status err';
        return;
      }
      spStatus.textContent = t('battle.spotify.searching');
      spStatus.className = 'battle-spotify-status';
      battleSpotifyTimer = setTimeout(async () => {
        try {
          const info = await fetchTrackInfo({ spotifyUrl: val });
          // Check for duplicate
          if (battleSongs.find(s => parseSpotifyId(s.url) === parseSpotifyId(val))) {
            spStatus.textContent = t('battle.spotify.duplicate');
            spStatus.className = 'battle-spotify-status err';
            return;
          }
          battleSongs.push(info);
          spInput.value = '';
          spStatus.textContent = '';
          spStatus.className = 'battle-spotify-status';
          renderBattleSongsList();
          updateBattleStartBtn();
          // Disable input if at max
          spInput.disabled = battleSongs.length >= 5;
        } catch {
          spStatus.textContent = t('battle.spotify.notfound');
          spStatus.className = 'battle-spotify-status err';
        }
      }, 600);
    });

    updateBattleStartBtn();

    // Start button
    document.getElementById('battle-start-btn').addEventListener('click', createBattle);
  }

  function renderBattleSongsList() {
    const list = document.getElementById('battle-songs-list');
    if (!list) return;
    list.innerHTML = '';
    battleSongs.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'battle-song-card';
      card.innerHTML = `
        <img class="battle-song-art" src="${escReq(s.image)}" alt="" onerror="this.style.background='var(--brand-90)'">
        <div class="battle-song-info">
          <p class="battle-song-title">${escReq(s.title)}</p>
          ${s.artist ? `<p class="battle-song-artist">${escReq(s.artist)}</p>` : ''}
        </div>
        <button class="battle-song-remove" data-battle-remove="${i}" aria-label="Retirer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>`;
      list.appendChild(card);
    });
    // Update count hint
    const hint = document.getElementById('battle-count-hint');
    if (hint) hint.textContent = `(${battleSongs.length}/5)`;
    // Re-enable input if under limit
    const spInput = document.getElementById('battle-spotify-input');
    if (spInput) spInput.disabled = battleSongs.length >= 5;
    // Click handler for remove buttons
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-battle-remove]');
      if (!btn) return;
      const idx = parseInt(btn.dataset.battleRemove);
      battleSongs.splice(idx, 1);
      renderBattleSongsList();
      updateBattleStartBtn();
    });
  }

  function updateBattleStartBtn() {
    const btn = document.getElementById('battle-start-btn');
    if (!btn) return;
    const ready = battleSongs.length >= 2 && battleDuration > 0;
    btn.disabled = !ready;
    btn.classList.toggle('ready', ready);
  }

  async function createBattle() {
    const btn = document.getElementById('battle-start-btn');
    if (btn) btn.disabled = true;
    const slug = currentEvents[reqEventIdx]?.slug || '';
    const qs   = slug ? `?event=${encodeURIComponent(slug)}` : '';
    try {
      const res = await fetch(`/api/battles${qs}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ duration: battleDuration, songs: battleSongs })
      });
      if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
      const { battle } = await res.json();
      // Immediately activate it
      const resActivate = await fetch(`/api/battles${qs}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ id: battle.id, status: 'active' })
      });
      if (!resActivate.ok) throw new Error('Activation failed');
      showToast(t('toast.battle.started'), 'success');
      battleSongs    = [];
      battleDuration = 900;
      loadBattle();
    } catch (err) {
      showToast(t('toast.failed') + err.message, 'error');
      if (btn) btn.disabled = false;
    }
  }

  // Launch the battle form pre-populated with the selected requests
  async function launchBattleFromRequests() {
    // Check if a battle is already ongoing
    const slug = currentEvents[reqEventIdx]?.slug || '';
    const qs   = slug ? `?event=${encodeURIComponent(slug)}` : '';
    try {
      const res = await fetch(`/api/battles${qs}`, { headers: { Authorization: `Bearer ${token}` } });
      if (res.ok) {
        const battles = await res.json();
        if (battles.find(b => b.status === 'active')) {
          // Show error banner in requests tab (don't switch)
          const existing = document.getElementById('battle-ongoing-banner');
          if (!existing) {
            const banner = document.createElement('div');
            banner.id = 'battle-ongoing-banner';
            banner.className = 'battle-ongoing-banner';
            banner.innerHTML = `
              <div class="battle-ongoing-icon">!</div>
              <p class="battle-ongoing-text">${t('battle.ongoing.error')}</p>`;
            reqBody.insertBefore(banner, reqBody.firstChild);
            setTimeout(() => { banner.remove(); }, 10000);
          }
          return;
        }
      }
    } catch { /* proceed even if check fails */ }

    const selected = reqList.filter(r => battleSelectedIds.has(r.id));
    battleSongs = selected.map(r => ({
      title:  r.title  || '',
      artist: r.artist || '',
      image:  r.image  || '',
      url:    r.url    || '',
    }));
    battleDuration    = 900; // default 15 min
    _battleFromRequests = true;
    setLiveTab('battle');
    renderBattleForm();
  }

  // ── Refresh / Create a Battle button (delegated — footer HTML can be replaced) ───
  document.getElementById('req-footer').addEventListener('click', e => {
    if (e.target.closest('#battle-create-btn')) {
      launchBattleFromRequests();
      return;
    }
    if (!e.target.closest('#req-refresh-btn')) return;
    if (liveActiveTab === 'played')      loadPlayedTracks();
    else if (liveActiveTab === 'battle') loadBattle();
    else if (liveActiveTab === 'messages') loadMessages();
    else loadRequests();
  });

  // ── DEMANDES tab: song requests ───────────────────────────────────────────────
  async function loadRequests(targetEl) {
    const el = targetEl || reqBody;
    el.innerHTML = '<div class="empty-state">Loading…</div>';
    const slug = currentEvents[reqEventIdx]?.slug || '';
    const qs   = slug ? `?event=${encodeURIComponent(slug)}` : '';
    try {
      const res = await fetch(`/api/requests${qs}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      reqList = await res.json();
    } catch (e) {
      el.innerHTML = `<div class="empty-state" style="color:var(--red)">Failed: ${e.message}</div>`;
      return;
    }
    renderRequests(el);

  function updateRequestFooter() {
    const footer = document.getElementById('req-footer');
    if (!footer) return;
    if (reqEventIsLive && battleSelectedIds.size >= 2) {
      if (!footer.querySelector('#battle-create-btn')) {
        footer.innerHTML = `<button class="battle-create-btn" id="battle-create-btn">${t('req.create.battle')}</button>`;
      }
    } else {
      if (!footer.querySelector('#req-refresh-btn')) {
        footer.innerHTML = `<button class="btn-dark" id="req-refresh-btn">${t('btn.refresh')}</button>`;
      }
    }
  }

  function renderRequests(targetEl) {
    const el = targetEl || reqBody;
    el.innerHTML = '';

    if (!reqList.length) {
      const emptyWrap = document.createElement('div');
      emptyWrap.className = 'req-empty-body';
      emptyWrap.innerHTML = `
        <p>${t('req.empty')}</p>
        <p style="margin-top:8px;color:var(--brand-80,#51534E)">${t('req.empty.hint').replace('\n', '<br>')}</p>`;
      el.appendChild(emptyWrap);
      return;
    }

    // Split live vs prior when event is live
    let liveReqs = reqList, priorReqs = [];
    if (reqEventIsLive) {
      const ev = currentEvents[reqEventIdx];
      const eventStartMs = ev && ev.date && ev.start_time
        ? new Date(`${ev.date}T${ev.start_time}:00`).getTime() : null;
      if (eventStartMs !== null) {
        priorReqs = reqList.filter(r => r.ts && r.ts < eventStartMs);
        liveReqs  = reqList.filter(r => !r.ts || r.ts >= eventStartMs);
      }
    }

    // Helper: build a request card
    function buildReqCard(r, battleSelectable) {
      const isPlayed  = r.status === 'played';
      const isDeleted = r.status === 'deleted';
      const card = document.createElement('div');
      const isSelected = battleSelectedIds.has(r.id);
      let cls = 'req-card';
      if (isDeleted)                  cls += ' deleted';
      if (battleSelectable && !isDeleted) cls += ' battle-selectable';
      if (isSelected)                 cls += ' battle-selected';
      card.className = cls;
      card.dataset.id = r.id;

      let timeStr = '';
      if (r.ts) {
        const d   = new Date(r.ts);
        const hh  = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        const dd  = String(d.getDate()).padStart(2, '0');
        const mo  = String(d.getMonth() + 1).padStart(2, '0');
        if (reqEventIsLive) {
          const ev2 = currentEvents[reqEventIdx];
          const esMs = ev2 && ev2.date && ev2.start_time
            ? new Date(`${ev2.date}T${ev2.start_time}:00`).getTime() : null;
          const isPrior = esMs !== null && r.ts < esMs;
          timeStr = isPrior ? `${dd}/${mo} • ${hh}:${min}` : `${hh}:${min}`;
        } else {
          timeStr = `${dd}/${mo} • ${hh}:${min}`;
        }
      }

      let controlHtml;
      if (isDeleted) {
        controlHtml = `<button class="req-restore-btn" aria-label="${t('req.restore')}" data-req-action="restore" data-id="${r.id}">${t('req.restore')}</button>`;
      } else if (reqEventIsLive) {
        controlHtml = `<button class="req-switch${isPlayed ? ' on' : ''}" aria-label="${isPlayed ? t('req.mark.not.played') : t('req.mark.played')}" data-req-action="toggle" data-id="${r.id}" data-status="${isPlayed ? 'sent' : 'played'}"></button>`;
      } else {
        controlHtml = `<button class="req-delete-btn" aria-label="Delete request" data-req-action="delete" data-id="${r.id}">
             <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
               <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
               <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
             </svg>
           </button>`;
      }
      card.innerHTML = `
        <img class="req-art" src="${r.image || ''}" alt="" onerror="this.style.background='var(--brand-90)'">
        <div class="req-info">
          <p class="req-title">${escReq(r.title)}</p>
          ${r.artist  ? `<p class="req-artist">${escReq(r.artist)}</p>` : ''}
          ${r.url     ? `<a class="req-artist" href="${escReq(r.url)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none;">Spotify</a>` : ''}
          ${timeStr   ? `<p class="req-time">${escReq(timeStr)}</p>` : ''}
          ${isDeleted ? `<p class="req-time" style="color:var(--red);font-size:12px;">${t('req.deleted.label')}</p>` : ''}
        </div>
        <div class="req-controls">${controlHtml}</div>`;

      if (battleSelectable && !isDeleted) {
        card.addEventListener('click', e => {
          if (e.target.closest('[data-req-action]')) return;
          if (battleSelectedIds.has(r.id)) battleSelectedIds.delete(r.id);
          else if (battleSelectedIds.size < 5) battleSelectedIds.add(r.id);
          card.classList.toggle('battle-selected', battleSelectedIds.has(r.id));
          updateRequestFooter();
        });
      }
      return card;
    }

    // Render live requests
    liveReqs.forEach(r => el.appendChild(buildReqCard(r, reqEventIsLive)));

    // "Requested before the event" toggle + collapsible prior section
    if (priorReqs.length > 0) {
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'req-prior-toggle';
      toggleBtn.innerHTML = `${escReq(t('req.prior.toggle'))}<svg width="8" height="6" viewBox="0 0 8 6" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1.5L4 4.5L7 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      el.appendChild(toggleBtn);

      const priorSection = document.createElement('div');
      priorSection.className = 'req-prior-section';
      el.appendChild(priorSection);
      priorReqs.forEach(r => priorSection.appendChild(buildReqCard(r, false)));

      toggleBtn.addEventListener('click', () => {
        const isOpen = priorSection.classList.toggle('open');
        toggleBtn.classList.toggle('open', isOpen);
      });
    }

    updateRequestFooter();
  }

  document.getElementById('req-close-btn').addEventListener('click', () => {
    if (_battleFromRequests && liveActiveTab === 'battle') {
      // Back from battle form → return to requests tab
      _battleFromRequests = false;
      battleSongs    = [];
      battleDuration = 900;
      battleSelectedIds = new Set();
      // Restore footer to default Refresh button before switching
      const footer = document.getElementById('req-footer');
      if (footer) footer.innerHTML = `<button class="btn-dark" id="req-refresh-btn">${t('btn.refresh')}</button>`;
      setLiveTab('requests');
      loadRequests();
    } else {
      closeRequests();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && reqOverlay.classList.contains('open')) closeRequests(); });

  reqBody.addEventListener('click', async e => {
    // Handle track now-playing buttons
    const trackBtn = e.target.closest('[data-track-action="set-now-playing"]');
    if (trackBtn) {
      trackBtn.disabled = true;
      await setNowPlayingTrack(trackBtn.dataset.trackId);
      trackBtn.disabled = false;
      return;
    }

    const btn = e.target.closest('[data-req-action]');
    if (!btn) return;
    const { reqAction, id, status } = btn.dataset;

    // Confirm before deleting (next events only — live uses toggle, not delete)
    if (reqAction === 'delete') {
      const msg = currentLang === 'fr'
        ? 'Supprimer cette demande ? Cette action est irréversible.'
        : 'Delete this request? This cannot be undone.';
      if (!confirm(msg)) return;
    }

    btn.disabled = true;
    const patchSlug = currentEvents[reqEventIdx]?.slug || '';
    const patchQs   = patchSlug ? `?event=${encodeURIComponent(patchSlug)}` : '';

    // Determine which status to send
    let newStatus;
    if (reqAction === 'delete')      newStatus = 'deleted';
    else if (reqAction === 'restore') newStatus = 'sent';
    else newStatus = status; // toggle sends 'played' or 'sent' via data-status

    try {
      const res = await fetch(`/api/requests${patchQs}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ id, status: newStatus })
      });
      if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
      // Delete: remove from list entirely; others: update status in place
      const i = reqList.findIndex(r => r.id === id);
      if (i >= 0) {
        if (reqAction === 'delete') reqList.splice(i, 1);
        else reqList[i].status = newStatus;
      }
      renderRequests();
    } catch (err) {
      showToast(t('toast.failed') + err.message, 'error');
      btn.disabled = false;
    }
  });

  // ── MESSAGES tab ──────────────────────────────────────────────────────────────
  async function loadMessages() {
    reqBody.innerHTML = '<div class="empty-state">Loading…</div>';
    const slug = currentEvents[reqEventIdx]?.slug || '';
    const qs   = slug ? `?event=${encodeURIComponent(slug)}` : '';
    const footer = document.getElementById('req-footer');
    if (footer) footer.innerHTML = `<button class="btn-dark" id="req-refresh-btn">${t('btn.refresh')}</button>`;
    try {
      const res = await fetch(`/api/messages${qs}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      // 401/404 = endpoint not yet available or no messages — show empty state
      if (res.status === 401 || res.status === 404) { renderMessages([]); return; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const messages = await res.json();
      renderMessages(messages);
    } catch (e) {
      reqBody.innerHTML = `<div class="empty-state" style="color:var(--red)">Failed: ${e.message}</div>`;
    }
  }

  function renderMessages(messages) {
    reqBody.innerHTML = '';
    if (!Array.isArray(messages) || !messages.length) {
      const wrap = document.createElement('div');
      wrap.className = 'req-empty-body';
      wrap.innerHTML = `<p>${t('msg.empty')}</p>`;
      reqBody.appendChild(wrap);
      return;
    }
    const list = document.createElement('div');
    list.className = 'msg-list';
    const sorted = [...messages].sort((a, b) => (b.ts || 0) - (a.ts || 0));
    sorted.forEach(m => {
      const card = document.createElement('div');
      card.className = 'msg-card';
      let timeStr = '';
      if (m.ts) {
        const d = new Date(m.ts);
        timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      card.innerHTML = `
        <p class="msg-text">${escReq(m.text || m.message || '')}</p>
        ${timeStr ? `<p class="msg-time">${timeStr}</p>` : ''}`;
      list.appendChild(card);
    });
    reqBody.appendChild(list);
  }

  function escReq(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  // ── Utils ─────────────────────────────────────────────────────────────────────
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 10000);
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  if (token) showAdmin();

  // ── EVENT DETAIL SCREEN ───────────────────────────────────────────────────────

  let currentEventDetailIdx = -1;
  let evPendingCustomFile   = null;
  let evPendingAvatarUrl    = null;
  let evPendingAvatarUser   = null;

  function updateEventLogo(s){var l=document.getElementById('event-logo-img');if(l)l.src=s||'../images/og-image.png';}
  function openEventDetail(idx) {
    currentEventDetailIdx = idx;
    const ev = currentEvents[idx];
    if (!ev) return;

    // Populate fields
    document.getElementById('ev-venue').value      = ev.venue      || '';
    document.getElementById('ev-address').value    = ev.address    || '';
    document.getElementById('ev-date').value       = ev.date       || '';
    document.getElementById('ev-start').value      = ev.start_time || '';
    document.getElementById('ev-end').value        = ev.end_time   || '';
    document.getElementById('ev-instagram').value  = ev.instagram  || '';
    document.getElementById('ev-twitch').value     = ev.twitch     || '';
    document.getElementById('ev-image-path').value = ev.image      || '';

    // Reset pending state
    evPendingCustomFile = null;
    evPendingAvatarUrl  = null;
    evPendingAvatarUser = null;

    // Image preview
    const preview = document.getElementById('ev-img-preview');
    const status  = document.getElementById('ev-img-status');
    const revertBtn = document.getElementById('ev-revert-btn');

    if (ev.image) {
      const src = ev.image.startsWith('/api/') ? ev.image : '../' + ev.image.replace(/^\//, '');
      preview.src = src;
      preview.style.display = '';
      status.textContent = 'Current photo';updateEventLogo(src);
    } else if (ev.instagram) {
      const u = extractIgUsername(ev.instagram);
      if (u) {
        const src = `https://unavatar.io/instagram/${u}`;
        preview.src = src;
        preview.style.display = '';
        status.textContent = 'From Instagram';updateEventLogo(src);
        evPendingAvatarUrl  = src;
        evPendingAvatarUser = u;
      } else {
        preview.style.display = 'none';
        status.textContent = '';
      }
    } else {
      preview.style.display = 'none';
      status.textContent = '';
    }
    revertBtn.style.display = extractIgUsername(ev.instagram || '') ? '' : 'none';

    // Show toggle
    document.getElementById('ev-show-toggle').classList.toggle('on', ev.show !== false);

    // Placeholder content for non-Info tabs
    evFillSupportTabs(ev);

    // Set status badge
    const _badge = document.getElementById('event-status-badge');
    if (_badge) {
      const _isLive = isEventLive(ev);
      _badge.textContent = _isLive ? t('status.live') : t('status.next');
      _badge.className = 'event-status-badge ' + (_isLive ? 'live' : 'next');
    }
    // Switch to Info tab & show screen
    switchEventTab('info');
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('event-screen').classList.add('open');
    history.pushState({ eventId: ev.id }, '', '?event=' + encodeURIComponent(ev.id));
  }

  function closeEventDetail() {
    document.getElementById('event-screen').classList.remove('open');
    document.getElementById('admin-screen').style.display = '';
    history.pushState({}, '', location.pathname);
    currentEventDetailIdx = -1;
    evPendingCustomFile = null;
    evPendingAvatarUrl  = null;
    evPendingAvatarUser = null;
  }

  function switchEventTab(name) {
    document.querySelectorAll('.event-tab').forEach(tab =>
      tab.classList.toggle('active', tab.dataset.tab === name));
    document.querySelectorAll('.event-pane').forEach(pane =>
      pane.classList.toggle('active', pane.dataset.pane === name));

    // Update sticky footer to match the active tab
    const footerInner = document.querySelector('.event-footer-inner');
    if (!footerInner) return;
    const ev = currentEventDetailIdx >= 0 ? currentEvents[currentEventDetailIdx] : null;
    const isLive = isEventLive(ev);

    if (name === 'info') {
      footerInner.innerHTML = `<button class="btn-dark" id="ev-save-btn" data-i18n="btn.save">${t('btn.save')}</button>`;
    } else if (name === 'playing') {
      footerInner.innerHTML = isLive ? `<button class="btn-dark">${t('btn.refresh')}</button>` : '';
    } else if (name === 'battle') {
      if (isLive) {
        footerInner.innerHTML = `<button class="battle-start-btn" disabled>${t('battle.create.btn')}</button>`;
      } else {
        footerInner.innerHTML = '';
      }
    } else if (name === 'requests') {
      footerInner.innerHTML = `<button class="btn-dark" id="ev-req-refresh-btn">${t('btn.refresh')}</button>`;
      reqEventIdx    = currentEventDetailIdx;
      reqEventIsLive = isEventLive(currentEvents[currentEventDetailIdx]);
      loadRequests(document.getElementById('ev-req-pane'));
      setTimeout(() => {
        const btn = document.getElementById('ev-req-refresh-btn');
        if (btn) btn.addEventListener('click', () => {
          reqEventIdx    = currentEventDetailIdx;
          reqEventIsLive = isEventLive(currentEvents[currentEventDetailIdx]);
          loadRequests(document.getElementById('ev-req-pane'));
        });
      }, 0);
    } else if (name === 'messages') {
      footerInner.innerHTML = `<button class="btn-dark">${t('btn.refresh')}</button>`;
    }
  }

  function evFillSupportTabs(ev) {
    const isLive = ev && isEventLive(ev);
    // Playing — next = Serato hint centered; live = same but with live context
    document.getElementById('ev-playing-pane').innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;padding-top:8px;text-align:center;">`
      + `<p style="font-size:16px;font-weight:300;color:var(--brand-50);line-height:22px;margin:0;">${isLive ? t('playing.empty') : t('playing.next.empty')}</p>`
      + `<p style="font-size:14px;font-weight:300;color:var(--brand-70);line-height:20px;margin:0;">${isLive ? t('playing.empty.hint') : t('playing.next.empty.hint')}</p>`
      + `</div>`;
    // Battle — depends on whether event is live
    document.getElementById('ev-battle-pane').innerHTML = isLive
      ? `<div class="battle-form">
          <div class="battle-field">
            <label class="edit-label">${t('battle.time.label')}</label>
            <select class="edit-input" id="ev-battle-duration">
              <option value="300">5 min</option>
              <option value="900" selected>15 min</option>
              <option value="1800">30 min</option>
            </select>
          </div>
          <div class="battle-field">
            <label class="edit-label">${t('battle.songs.label')}</label>
            <input class="edit-input" type="url" placeholder="${t('battle.spotify.placeholder')}">
          </div>
        </div>`
      : `<p class="empty-state" style="text-align:center;">${t('battle.next.empty')}</p>`;
    // Requests
    document.getElementById('ev-req-pane').innerHTML =
      `<div class="empty-state">${t('req.empty')}</div>`;
    // Messages
    document.getElementById('ev-messages-pane').innerHTML =
      `<p class="empty-state">${t('msg.empty')}</p>`;
  }

  // Tab clicks
  document.querySelector('#event-screen .event-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.event-tab');
    if (tab) switchEventTab(tab.dataset.tab);
  });

  // Back button
  document.getElementById('event-back-btn').addEventListener('click', closeEventDetail);
  window.addEventListener('popstate', () => {
    const _pid = new URLSearchParams(location.search).get('event');
    if (_pid) {
      const _pidx = currentEvents.findIndex(e => String(e.id) === _pid);
      if (_pidx >= 0) { openEventDetail(_pidx); return; }
    }
    if (document.getElementById('event-screen').classList.contains('open')) {
      document.getElementById('event-screen').classList.remove('open');
      document.getElementById('admin-screen').style.display = '';
      currentEventDetailIdx = -1;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('event-screen').classList.contains('open')) {
      closeEventDetail();
    }
  });

  // Show toggle
  document.getElementById('ev-show-toggle').addEventListener('click', function() {
    this.classList.toggle('on');
  });

  // Instagram debounce → preview
  {
    const igInput = document.getElementById('ev-instagram');
    let igDebounce;
    igInput.addEventListener('input', () => {
      const revertBtn = document.getElementById('ev-revert-btn');
      revertBtn.style.display = extractIgUsername(igInput.value.trim()) ? '' : 'none';
      if (evPendingCustomFile) return;
      clearTimeout(igDebounce);
      igDebounce = setTimeout(() => {
        const u = extractIgUsername(igInput.value.trim());
        const preview = document.getElementById('ev-img-preview');
        const status  = document.getElementById('ev-img-status');
        if (!u) {
          preview.style.display = 'none'; status.textContent = '';
          evPendingAvatarUrl = null; evPendingAvatarUser = null;
          return;
        }
        const src = `https://unavatar.io/instagram/${u}`;
        evPendingAvatarUrl = src; evPendingAvatarUser = u;
        document.getElementById('ev-image-path').value = '';
        preview.src = src; preview.style.display = '';
        status.textContent = 'From Instagram · will be saved on save';
      }, 600);
    });
  }

  // Overwrite photo
  document.getElementById('ev-overwrite-btn').addEventListener('click', () => {
    document.getElementById('ev-img-file').click();
  });
  document.getElementById('ev-img-file').addEventListener('change', () => {
    const file = document.getElementById('ev-img-file').files[0];
    if (!file) return;
    evPendingCustomFile = file;
    evPendingAvatarUrl  = null;
    evPendingAvatarUser = null;
    document.getElementById('ev-image-path').value = '';
    const preview = document.getElementById('ev-img-preview');
    const status  = document.getElementById('ev-img-status');
    preview.src = URL.createObjectURL(file);
    preview.style.display = '';
    status.textContent = 'Custom photo · will be saved on save';updateEventLogo(preview.src);
  });

  // Revert to Instagram
  document.getElementById('ev-revert-btn').addEventListener('click', () => {
    evPendingCustomFile = null;
    document.getElementById('ev-image-path').value = '';
    const u = extractIgUsername(document.getElementById('ev-instagram').value.trim());
    const preview = document.getElementById('ev-img-preview');
    const status  = document.getElementById('ev-img-status');
    if (u) {
      const src = `https://unavatar.io/instagram/${u}`;
      evPendingAvatarUrl = src; evPendingAvatarUser = u;
      preview.src = src; preview.style.display = '';
      status.textContent = 'From Instagram · will be saved on save';
    } else {
      preview.style.display = 'none'; status.textContent = '';
    }
  });

  // Save from event detail page — delegated because button is replaced on tab switch
  document.getElementById('event-screen').addEventListener('click', async (e) => {
    if (!e.target.closest('#ev-save-btn')) return;
    if (currentEventDetailIdx < 0) return;
    const saveBtn = document.getElementById('ev-save-btn');
    const venue = document.getElementById('ev-venue').value.trim();
    if (!venue) { showToast(t('toast.venue.required'), 'error'); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = t('btn.saving');

    try {
      let imagePath = document.getElementById('ev-image-path').value.trim();

      if (evPendingCustomFile) {
        try {
          const key = `events/${slugify(venue)}.jpg`;
          imagePath = await uploadImageToBlob(evPendingCustomFile, key);
          evPendingCustomFile = null;
        } catch (e) { showToast(t('toast.img.failed') + e.message, 'error'); }
      } else if (evPendingAvatarUrl && evPendingAvatarUser) {
        try {
          imagePath = await uploadAvatarToBlob(evPendingAvatarUrl, evPendingAvatarUser);
          evPendingAvatarUrl = null; evPendingAvatarUser = null;
        } catch (_) { imagePath = ''; }
      }

      const ev = currentEvents[currentEventDetailIdx];
      ev.venue      = venue;
      ev.address    = document.getElementById('ev-address').value.trim();
      ev.date       = document.getElementById('ev-date').value;
      ev.start_time = document.getElementById('ev-start').value;
      ev.end_time   = document.getElementById('ev-end').value;
      ev.instagram  = document.getElementById('ev-instagram').value.trim();
      ev.twitch     = document.getElementById('ev-twitch').value.trim();
      ev.image      = imagePath;
      ev.show       = document.getElementById('ev-show-toggle').classList.contains('on');

      await saveEvents(`Update gig: ${venue}`);
      renderLive();
      renderGigs();
      scheduleGigRefresh();
      document.getElementById('ev-image-path').value = imagePath;
      showToast(`"${venue}" ${t('toast.entry.saved').toLowerCase()}`, 'success');
    } catch (e) {
      showToast(t('toast.save.failed') + e.message, 'error');
    }

    saveBtn.disabled = false;
    saveBtn.textContent = t('btn.save');
  });

  // Delete from event detail page
  document.getElementById('ev-delete-btn').addEventListener('click', async () => {
    if (currentEventDetailIdx < 0) return;
    const ev = currentEvents[currentEventDetailIdx];
    if (!confirm(`Delete "${ev.venue}"?\nThis cannot be undone.`)) return;
    const idx = currentEventDetailIdx;
    closeEventDetail();
    currentEvents.splice(idx, 1);
    try {
      await saveEvents(`Delete gig: ${ev.venue}`);
      renderLive();
      renderGigs();
      showToast(`"${ev.venue}" ${t('toast.deleted')}`, 'success');
    } catch (e) {
      showToast(t('toast.delete.failed') + e.message, 'error');
      loadEvents().then(() => { renderLive(); renderGigs(); });
    }
  });
</script>
</body>
</html>
