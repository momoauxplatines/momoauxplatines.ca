<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Momo Aux Platines</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    :root {
      /* ── Brand Colors — Figma: Collection "Momo" ── */
      --bg: #000000; --brand-00: #fafbf9; --brand-10: #f4f6f3;
      --brand-20: #eaede5; --brand-30: #dee4da; --brand-40: #d5dccc;
      --brand-50: #c9d3c0; --brand-60: #a2a89b; --brand-70: #797f73; --brand-80: #51534e;
      --brand-90: #282a27; --brand-95: #20221f; --brand-100: #141513; --brand-105: #111210;
      --red: #d34242; --blue: #007aff; --green: #34c759; --black: #000000;
      --radius-0: 0px; --radius-4: 4px; --radius-8: 8px; --radius-16: 16px; --radius-72: 72px;
      --gap-0: 0px; --gap-4: 4px; --gap-8: 8px; --gap-12: 12px; --gap-16: 16px;
      --gap-20: 20px; --gap-24: 24px; --gap-32: 32px; --gap-80: 80px;
      --stroke-0: 0px; --stroke-1: 1px;
      --avatar-header: 40px; --avatar-event-card: 48px; --avatar-admin: 56px;
      --avatar-song-card: 64px; --avatar-event: 72px; --avatar-home: 80px;
      --shadow-blur-fields: 4px;
    }
    html, body { background: var(--bg); color: var(--brand-30); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; min-height: 100dvh; }

    /* ── Login ── */
    .login-wrap { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; }
    .login-card { background: var(--brand-100); border: 1px solid var(--brand-90); border-radius: 16px; padding: 32px 24px; display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 420px; }
    .login-heading { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 28px; color: var(--brand-20); text-transform: uppercase; }
    .login-sub { font-size: 14px; font-weight: 300; color: var(--brand-50); line-height: 1.5; }
    .login-sub a { color: var(--brand-50); }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field-label { font-family: inherit; font-weight: 274; font-size: 18px; line-height: 22px; color: var(--brand-60); }
    .field-input { background: var(--brand-90); border: 1px solid var(--brand-80); border-radius: 10px; padding: 12px 16px; font-family: inherit; font-size: 16px; font-weight: 300; color: var(--brand-00); outline: none; width: 100%; -webkit-appearance: none; transition: border-color 0.2s; }
    .field-input::placeholder { color: var(--brand-80); }
    .field-input:focus { border-color: var(--brand-50); }
    .field-input.invalid { border-color: var(--red); }
    .error-msg { font-size: 13px; font-weight: 300; color: var(--red); min-height: 18px; }
    .btn-login { background: var(--brand-20); border: none; border-radius: 14px; color: var(--brand-100); font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 17px; height: 52px; width: 100%; cursor: pointer; transition: opacity 0.15s; }
    .btn-login:hover { opacity: 0.85; }
    .btn-login:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Admin shell ── */
    #admin-screen { display: none; min-height: 100dvh; }
    #admin-screen.active { display: block; }

    /* ── Fixed header ── */
    .admin-header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 24px 16px; gap: 0; }
    .header-left { display: none; }
    .header-favicon { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    .header-favicon img { width: 100%; height: 100%; object-fit: cover; }
    .header-title { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 20px; color: var(--brand-50); text-transform: uppercase; }
    .header-logo-box { display: block; width: 40px; height: 40px; object-fit: cover; flex-shrink: 0; }
    .btn-admin { background: var(--brand-90); border: 1px solid var(--brand-80); border-radius: 8px; color: var(--brand-00); font-family: inherit; font-size: 18px; font-weight: 300; height: 40px; padding: 0 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .btn-admin:hover { background: var(--brand-80); }
    .btn-admin:disabled { opacity: 0.5; cursor: not-allowed; }
    #logout-btn { background: var(--brand-90); border: none; border-radius: var(--radius-4); font-size: 18px; font-weight: 700; font-family: inherit; }
    #logout-btn:hover { opacity: 0.85; }

    /* ── Language tabs (in header) ── */
    .lang-tabs { display: flex; order: 3; width: 100%; justify-content: flex-start; padding: 10px 0 2px; gap: 8px; }
    .lang-tab { height: 48px; display: flex; align-items: center; justify-content: center; font-family: inherit; font-weight: 274; font-size: 20px; line-height: 26px; color: var(--brand-70); cursor: pointer; border: 1px solid var(--brand-90); background: var(--brand-100); border-radius: 32px; transition: color 0.15s, border-color 0.15s, background 0.15s, border-radius 0.15s; padding: 0 20px; white-space: nowrap; }
    .lang-tab:not(.active):hover { color: var(--brand-50); }
    .lang-tab.active { background: var(--brand-105); border-color: var(--brand-80); border-radius: 40px; color: var(--brand-00); }

    /* ── Tablet+: grid 1fr auto 1fr — logo gauche, tabs centré, logout droite ── */
    @media (min-width: 768px) {
      .admin-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; flex-wrap: nowrap; padding: 24px 16px; }
      .lang-tabs { order: 0; width: auto; flex: none; justify-content: center; padding: 0; gap: 16px; }
      #logout-btn { justify-self: end; }
    }

    /* ── Scrollable content ── */
    .admin-content { padding-top: 110px; max-width: 770px; margin: 0 auto; }
    @media (min-width: 768px) { .admin-content { padding-top: 88px; } }

    /* ── Sections ── */
    .admin-section { padding: 24px; display: flex; flex-direction: column; gap: 24px; }
    .section-title-row { display: flex; align-items: center; justify-content: space-between; }
    .section-heading { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 28px; color: var(--brand-30); text-transform: uppercase; line-height: 31px; }
    .decade-title-row { display: flex; align-items: center; justify-content: space-between; }
    .decade-heading { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 20px; color: var(--brand-50); text-transform: uppercase; line-height: 26px; }

    /* ── Admin card ── */
    .admin-card { background: var(--brand-105); border: 1px solid var(--brand-90); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .card-avatar { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid var(--brand-80); flex-shrink: 0; background: var(--brand-90); }
    .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-avatar.round { border-radius: 40px; }
    .card-name { font-size: 18px; font-weight: 300; color: var(--brand-30); line-height: 22px; }
    .card-sub  { font-size: 18px; font-weight: 300; color: var(--brand-30); line-height: 22px; }
    .card-text { font-size: 18px; font-weight: 300; color: var(--brand-30); line-height: 22px; }
    .card-link-text { font-size: 18px; font-weight: 300; color: var(--brand-30); line-height: 22px; }
    .card-thumb { position: relative; display: inline-grid; }
    .card-thumb-img { width: 91px; height: 56px; border-radius: 8px; object-fit: cover; border: 1px solid var(--brand-80); }
    .btn-card-edit { background: var(--brand-90); border: none; border-radius: 4px; color: var(--brand-00); font-family: inherit; font-size: 18px; font-weight: 700; text-transform: uppercase; height: 40px; width: 100%; cursor: pointer; }
    .btn-card-edit:hover { background: var(--brand-80); }
    .gig-card-actions .btn-card-edit { width: auto; padding: 0 16px; }

    /* ── Empty state ── */
    .empty-state { height: 152px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 300; color: var(--brand-60); text-align: center; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--brand-90); border: 1px solid var(--brand-80); border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 300; color: var(--brand-20); white-space: nowrap; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red); }

    /* ── Edit overlay ── */
    .edit-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.2s; overflow: hidden; }
    .edit-overlay.open { opacity: 1; pointer-events: auto; }
    .edit-panel { display: contents; } /* mobile: panel is transparent, overlay IS the panel */
    .edit-header { flex-shrink: 0; position: relative; background: var(--bg); padding: 32px 24px 24px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--brand-90); }
    .edit-titles { padding-right: 80px; display: flex; flex-direction: column; gap: 10px; }
    .edit-title { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 32px; color: var(--brand-30); text-transform: uppercase; line-height: 36px; }
    .edit-close { position: absolute; top: 28px; right: 24px; background: var(--brand-90); border: none; cursor: pointer; padding: 4px 16px; border-radius: 8px; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 16px; color: var(--brand-00); line-height: 31px; }
    .edit-close:hover { background: var(--brand-80); }
    .edit-subtitle { font-weight: 300; font-size: 16px; line-height: 22px; color: var(--brand-50); }
    .edit-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .edit-footer { flex-shrink: 0; padding: 24px; background: var(--bg); box-shadow: 0 -12px 24px rgba(17,18,16,0.9); }

    /* ── Desktop: overlay becomes backdrop, panel floats centred ── */
    @media (min-width: 860px) {
      .edit-overlay { background: rgba(17,18,16,0.75); backdrop-filter: blur(6px); align-items: center; justify-content: center; }
      .edit-panel { display: flex; flex-direction: column; width: 480px; max-height: 90dvh; background: var(--bg); border-radius: 20px; overflow: hidden; box-shadow: 0 0 40px 20px rgba(0,0,0,0.7); }
    }
    .btn-save { background: var(--brand-90); border: none; border-radius: 8px; color: var(--brand-00); font-family: inherit; font-weight: 700; font-size: 18px; height: 56px; width: 100%; max-width: 770px; cursor: pointer; transition: background 0.15s; }
    .btn-save:hover:not(:disabled) { background: var(--brand-80); }
    .btn-save:disabled { background: var(--brand-100); color: var(--brand-80); cursor: not-allowed; }
    .btn-dark { background: var(--brand-90, #282a27); border: 1px solid var(--brand-80, #51534e); border-radius: 8px; color: var(--brand-00, #fafbf9); font-family: inherit; font-size: 18px; font-weight: 300; height: 56px; width: 100%; cursor: pointer; transition: opacity 0.15s; }
    .btn-dark:hover { opacity: 0.8; }
    .gig-live-status { display: flex; align-items: center; gap: 4px; background: var(--brand-100); padding: 4px 12px; border-radius: 72px; }
    .gig-live-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); flex-shrink: 0; animation: live-pulse 1.5s ease-in-out infinite; }
    @keyframes live-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .gig-live-label { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 18px; color: var(--red); text-transform: uppercase; line-height: 26px; }

    /* ── Form fields (in edit overlay) ── */
    .edit-field { display: flex; flex-direction: column; gap: 8px; }
    .edit-label { font-family: inherit; font-weight: 274; font-size: 18px; line-height: 22px; color: var(--brand-60); }
    .edit-input { background: var(--brand-95); border: 1px solid var(--brand-90); border-radius: var(--radius-8); padding: 12px 16px; font-family: inherit; font-size: 18px; font-weight: 300; color: var(--brand-30); outline: none; width: 100%; -webkit-appearance: none; transition: border-color 0.2s, background 0.2s; resize: none; }
    .edit-input::placeholder { color: var(--brand-60); }
    .edit-input:focus { background: var(--brand-100); border-color: var(--brand-90); }
    .edit-select { background: var(--brand-95); border: 1px solid var(--brand-90); border-radius: var(--radius-8); padding: 16px 48px 16px 20px; font-family: inherit; font-size: 18px; font-weight: 300; color: var(--brand-30); outline: none; width: 100%; -webkit-appearance: none; appearance: none; cursor: pointer; transition: border-color 0.2s, background 0.2s; background-image: url("data:image/svg+xml,%3Csvg width='16' height='10' viewBox='0 0 16 10' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L8 9L15 1' stroke='%23C9D3C0' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 20px center; }
    .edit-select:focus { background: var(--brand-100); border-color: var(--brand-90); }
    .edit-select option { background: var(--brand-100); }

    /* ── Card list gaps ── */
    #gigs-list, #reviews-list, #demos-list, .decade-cards { display: flex; flex-direction: column; gap: 24px; }
    #past-gigs-list { display: flex; flex-direction: column; gap: 16px; }

    /* ── Image picker row ── */
    .image-row { display: flex; align-items: center; gap: 24px; }
    .image-preview { width: 88px; height: 88px; border-radius: 560px; border: 1px solid var(--brand-50); overflow: hidden; flex-shrink: 0; background: var(--brand-90); }
    .image-preview img { width: 100%; height: 100%; object-fit: cover; }
    .image-preview.square { border-radius: 8px; }
    .image-preview.rect { border-radius: 8px; width: 141px; height: 88px; }

    /* ── Tags ── */
    .tags-section { display: flex; flex-direction: column; gap: 16px; }
    .tags-existing { display: flex; flex-wrap: wrap; gap: 12px; }
    .tag-chip { background: var(--brand-90); border: 1px solid var(--brand-80); border-radius: 8px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; }
    .tag-chip span { font-size: 18px; font-weight: 300; color: var(--brand-00); white-space: nowrap; }
    .tag-remove { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: var(--red); flex-shrink: 0; }
    .tag-remove:hover { opacity: 0.7; }

    /* ── Event form fields ── */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .show-toggle-row { display: flex; align-items: center; gap: 8px; height: 40px; }
    .show-toggle-label { flex: 1; font-size: 18px; font-weight: 300; color: var(--brand-50); line-height: 26px; }
    .btn-delete-gig { background: var(--brand-90, #282a27); border: 1px solid var(--red, #F06A6A); border-radius: 8px; color: var(--red, #F06A6A); font-family: inherit; font-size: 18px; font-weight: 300; height: 56px; min-height: 56px; flex-shrink: 0; width: 100%; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
    .btn-delete-gig:hover { background: var(--red, #F06A6A); border-color: var(--red, #F06A6A); color: var(--brand-00, #fafbf9); }
    .ig-preview-wrap { display: none; flex-direction: column; gap: 10px; }
    .ig-preview-wrap.visible { display: flex; }
    .ig-preview-row { display: flex; align-items: center; gap: 12px; }
    .ig-preview-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--brand-90); border: 1px solid var(--brand-80); flex-shrink: 0; }
    .ig-preview-info { display: flex; flex-direction: column; gap: 3px; }
    .ig-preview-name { font-size: 14px; font-weight: 600; color: var(--brand-20); }
    .ig-preview-status { font-size: 12px; font-weight: 300; color: var(--brand-50); }
    .ig-preview-status.ok  { color: var(--green); }
    .ig-preview-status.err { color: var(--red); }

    /* ── Gig card ── */
    .gig-card { background: var(--brand-105); border: 1px solid var(--brand-90); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 24px; cursor: default; transition: opacity 0.15s; }
    .gig-card--link { cursor: pointer; }
    .gig-card--link:hover { opacity: 0.85; }
    .gig-card-top { display: flex; gap: 16px; align-items: flex-start; pointer-events: none; }
    .gig-card-avatar { width: 72px; height: 72px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: var(--brand-90); }
    .gig-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .gig-card-copy { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .gig-card-name { font-size: 18px; font-weight: 700; color: var(--brand-30); line-height: 1; }
    .gig-card-meta { font-size: 16px; font-weight: 300; color: var(--brand-30); line-height: 20px; }
    .gig-card-actions { display: flex; align-items: center; justify-content: flex-end; }

    /* ── Requests overlay ── */
    .req-back-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: var(--brand-50); font-size: 18px; font-weight: 300; padding: 0; line-height: 26px; }
    .req-back-btn:hover { color: var(--brand-30); }
    .req-event-avatar { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: var(--brand-90); border: 1px solid var(--brand-100); }
    .req-event-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .req-list { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
    .req-section-title { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 20px; color: var(--brand-50); text-transform: uppercase; line-height: 26px; }
    .req-card { background: var(--brand-105); border: 1px solid var(--brand-90); border-radius: 8px; padding: 12px; display: flex; gap: 12px; align-items: flex-start; }
    .req-art { width: 40px; height: 40px; border-radius: 0; object-fit: cover; flex-shrink: 0; background: var(--brand-90); border: 1px solid var(--brand-100); }
    .req-info { flex: 1; display: flex; flex-direction: column; gap: 0; min-width: 0; }
    .req-title  { font-size: 18px; font-weight: 274; color: var(--brand-30); line-height: 22px; }
    .req-artist { font-size: 16px; font-weight: 300; color: var(--brand-30); line-height: 20px; }
    .req-time   { font-size: 16px; font-weight: 274; color: var(--brand-60); line-height: 20px; }
    .req-controls { display: flex; align-items: center; padding: 0 8px; align-self: stretch; }
    .req-switch { position: relative; width: 36px; height: 20px; border-radius: 100px; background: var(--brand-40); border: none; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
    .req-switch.on { background: var(--blue); }
    .req-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 100px; background: #fff; box-shadow: 0 2px 4px rgba(39,39,39,0.1); transition: transform 0.2s; }
    .req-switch.on::after { transform: translateX(16px); }
    .req-delete-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--red, #F06A6A); padding: 0; flex-shrink: 0; transition: opacity 0.15s; }
    .req-delete-btn:hover { opacity: 0.65; }
    .req-restore-btn { background: var(--brand-90); border: 1px solid var(--brand-80); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--brand-50); padding: 4px 8px; flex-shrink: 0; font-size: 12px; font-weight: 300; transition: opacity 0.15s; white-space: nowrap; }
    .req-restore-btn:hover { opacity: 0.75; }
    .req-prior-toggle { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; width: 100%; background: none; border: none; cursor: pointer; color: var(--brand-50); font-size: 16px; font-weight: 300; font-family: inherit; }
    .req-prior-toggle svg { transition: transform 0.2s; flex-shrink: 0; }
    .req-prior-toggle.open svg { transform: rotate(180deg); }
    .req-prior-section { display: none; flex-direction: column; gap: 16px; width: 100%; }
    .req-prior-section.open { display: flex; }
    .req-card.played   { border-width: 0; }
    .req-card.selected { border-color: var(--green); }
    .req-card.deleted  { opacity: 0.45; }

    /* Request card: battle selection mode (live events) */
    .req-card.battle-selectable { cursor: pointer; transition: background 0.12s, border-color 0.12s; }
    .req-card.battle-selected   { background: var(--brand-105) !important; border-color: var(--green) !important; }
    .req-card.battle-selectable:not(.battle-selected) { background: var(--brand-100) !important; border-color: var(--brand-90) !important; }

    /* "Create a Battle" footer button */
    .battle-create-btn { background: var(--brand-90); border: 1px solid var(--brand-80); border-radius: 8px; color: var(--brand-00); font-family: inherit; font-size: 18px; font-weight: 300; height: 56px; width: 100%; cursor: pointer; transition: background 0.15s; }
    .battle-create-btn:hover { background: var(--brand-80); }

    .req-empty-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; gap: 6px; }
    .req-empty-body p { font-size: 16px; font-weight: 300; color: var(--brand-60, #888); line-height: 22px; }

    /* ── Live gig tabs ── */
    .live-tabs-row { display: flex; padding: 12px 16px; gap: 8px; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
    .live-tabs-row::-webkit-scrollbar { display: none; }
    .live-tab-btn { flex: 0 0 auto; height: 40px; background: none; border: 1px solid transparent; border-radius: 100px; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 18px; transition: color 0.15s, border-color 0.15s; padding: 0 16px; white-space: nowrap; }
    .live-tab-btn.active   { color: var(--brand-00); border-color: var(--brand-00); }
    .live-tab-btn.inactive { color: var(--brand-70); border-color: transparent; }
    .live-tab-btn.inactive:hover { color: var(--brand-60); }

    /* ── Played track cards ── */
    .track-card { background: #000; border: 1px solid var(--brand-50); border-radius: 16px; padding: 8px; display: flex; gap: 8px; align-items: center; }
    .track-art { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--brand-90); border: 1px solid var(--brand-90); }
    .track-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; }
    .track-title  { font-size: 18px; font-weight: 700; color: var(--brand-30); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 16px; font-weight: 300; color: var(--brand-30); line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-time   { font-size: 14px; font-weight: 300; color: var(--brand-60); line-height: 18px; }
    .track-play-btn { width: 48px; height: 40px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s, transform 0.1s; }
    .track-play-btn:active { transform: scale(0.93); }
    .track-play-btn.state-unplayed { background: #20221f; }
    .track-play-btn.state-playing  { background: #007aff; }
    .track-play-btn.state-played   { background: #20221f; }
    .track-play-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Battle tab ── */
    .battle-form { display: flex; flex-direction: column; gap: 24px; padding: 16px; }
    .battle-field { display: flex; flex-direction: column; gap: 8px; }
    .battle-label { font-family: inherit; font-weight: 274; font-size: 18px; line-height: 22px; color: var(--brand-60); }
    .battle-input { background: var(--brand-95); border: 1px solid var(--brand-90); border-radius: var(--radius-8); padding: 16px 20px; font-family: inherit; font-size: 18px; font-weight: 300; color: var(--brand-30); outline: none; width: 100%; -webkit-appearance: none; transition: border-color 0.2s, background 0.2s; }
    .battle-input::placeholder { color: var(--brand-60); }
    .battle-input:focus { background: var(--brand-100); border-color: var(--brand-90); }
    .battle-input.active { background: var(--brand-100); border-color: var(--brand-90); }
    .battle-spotify-wrap { position: relative; display: flex; align-items: center; gap: 16px; background: var(--brand-95); border: 1px solid var(--brand-90); border-radius: var(--radius-8); padding: 14px 20px; transition: border-color 0.2s, background 0.2s; }
    .battle-spotify-wrap:focus-within { background: var(--brand-100); border-color: var(--brand-80); }
    .battle-spotify-wrap svg { flex-shrink: 0; color: var(--brand-60); }
    .battle-spotify-input { flex: 1; background: none; border: none; outline: none; font-family: inherit; font-size: 18px; font-weight: 300; color: var(--brand-30); min-width: 0; }
    .battle-spotify-input::placeholder { color: var(--brand-60); }
    .battle-spotify-status { font-size: 13px; font-weight: 300; color: var(--brand-60); min-height: 18px; padding-left: 4px; }
    .battle-spotify-status.err { color: var(--red); }
    .battle-songs-list { display: flex; flex-direction: column; gap: 8px; }
    .battle-song-card { background: var(--brand-105); border: 1px solid var(--brand-70); border-radius: 16px; padding: 8px; display: flex; gap: 8px; align-items: center; }
    .battle-song-art { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--brand-90); border: 1px solid var(--brand-90); }
    .battle-song-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; }
    .battle-song-title  { font-size: 18px; font-weight: 700; color: var(--brand-30); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .battle-song-artist { font-size: 16px; font-weight: 300; color: var(--brand-30); line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .battle-song-remove { width: 40px; height: 40px; border-radius: 8px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--red); transition: opacity 0.15s; }
    .battle-song-remove:hover { opacity: 0.7; }
    .battle-count-hint { font-size: 13px; font-weight: 300; color: var(--brand-60); }
    .battle-start-btn { background: var(--brand-90); border: 1px solid var(--brand-80); border-radius: 8px; color: var(--brand-00); font-family: inherit; font-size: 18px; font-weight: 300; height: 56px; width: 100%; cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s; }
    .battle-start-btn:not(:disabled):hover { background: var(--brand-80); }
    .battle-start-btn:disabled { color: var(--brand-80); border-color: var(--brand-90); cursor: not-allowed; }
    .battle-start-btn.ready { background: var(--brand-20); border-color: var(--brand-20); color: var(--brand-100); font-weight: 900; text-transform: uppercase; }
    .battle-start-btn.ready:hover { background: var(--brand-00); border-color: var(--brand-00); }
    .battle-active-card { background: #000; border: 1px solid var(--green); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .battle-active-title { font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 18px; color: var(--green); text-transform: uppercase; }
    .battle-active-meta { font-size: 16px; font-weight: 300; color: var(--brand-50); line-height: 20px; }
    .battle-active-songs { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .battle-end-btn { background: var(--brand-90); border: 1px solid var(--red); border-radius: 8px; color: var(--red); font-family: inherit; font-size: 18px; font-weight: 300; height: 48px; width: 100%; cursor: pointer; transition: background 0.15s; }
    .battle-end-btn:hover { background: var(--red); color: var(--brand-00); }
    /* Battle live / ended views */
    .battle-status-label { font-size: 18px; font-weight: 300; line-height: 26px; text-align: center; }
    .battle-status-label.active { color: var(--green); }
    .battle-status-label.ended  { color: #d34242; }
    .battle-live-songs { display: flex; flex-direction: column; gap: 8px; }
    .battle-live-card { background: #000; border-radius: 16px; padding: 8px; display: flex; gap: 8px; align-items: flex-start; }
    .battle-live-art { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--brand-90); border: 1px solid var(--brand-100); }
    .battle-live-body { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
    .battle-live-title  { font-size: 18px; font-weight: 700; color: var(--brand-30); line-height: 1.2; }
    .battle-live-artist { font-size: 18px; font-weight: 300; color: var(--brand-30); line-height: 26px; }
    .battle-vote-row { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: auto; padding-top: 4px; }
    .battle-vote-bar  { flex: 1; display: flex; height: 12px; }
    .battle-vote-fill  { height: 100%; border-radius: 2px 0 0 2px; flex-shrink: 0; min-width: 2px; transition: width 0.4s ease; }
    .battle-vote-fill.leading  { background: var(--green); }
    .battle-vote-fill.behind   { background: var(--brand-70); }
    .battle-vote-empty { height: 100%; flex: 1; border-radius: 0 2px 2px 2px; background: var(--brand-105); min-width: 1px; }
    .battle-vote-pct   { font-size: 16px; font-weight: 300; color: var(--brand-70); white-space: nowrap; min-width: 38px; text-align: right; }
    .battle-new-btn { background: var(--brand-90); border: 1px solid var(--brand-80); border-radius: 8px; color: var(--brand-00); font-family: inherit; font-size: 18px; font-weight: 300; height: 56px; width: 100%; cursor: pointer; transition: background 0.15s; }
    .battle-new-btn:hover { background: var(--brand-80); }
    .battle-new-btn:disabled { background: var(--brand-100); border-color: var(--brand-90); color: var(--brand-80); cursor: not-allowed; }
    .battle-footer { flex-shrink: 0; padding: 16px; }
    /* ── Messages tab ── */
    .msg-list { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
    .msg-card { background: #000; border: 1px solid var(--brand-50); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg-text { font-size: 18px; font-weight: 300; color: var(--brand-30); line-height: 26px; }
    .msg-time { font-size: 16px; font-weight: 300; color: var(--brand-60); line-height: 20px; }
    /* ── Battle ongoing error ── */
    .battle-ongoing-banner { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 16px 0; }
    .battle-ongoing-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: #fff; flex-shrink: 0; }
    .battle-ongoing-text { font-size: 18px; font-weight: 300; color: var(--brand-30); text-align: center; }

    /* ── Event detail screen ── */
    .event-screen { background: var(--bg); display: none; flex-direction: column; overflow: hidden; min-height: 100vh; }
    .event-screen.open { display: flex; }
    .event-header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--bg); }
    .btn-back { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: var(--brand-50); font-size: 16px; font-weight: 300; padding: 8px 0; line-height: 20px; }
    .btn-back:hover { color: var(--brand-30); }
    .event-logo { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; border: 1px solid var(--brand-100); flex-shrink: 0; }
    .event-logo img { width: 100%; height: 100%; object-fit: cover; }
    .event-status-badge { font-family: Kanit, sans-serif; font-weight: 900; font-size: 18px; line-height: 26px; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 12px; border-radius: 72px; background: var(--brand-100); flex: 1; text-align: center; }
    .event-status-badge.live { color: #d34242; }
    .event-status-badge.live::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #d34242; margin-right: 6px; vertical-align: middle; margin-bottom: 2px; }
    .event-status-badge.next { color: #007aff; }
    .event-tabs-wrap { flex-shrink: 0; display: flex; justify-content: center; overflow-x: auto; padding: 16px; scrollbar-width: none; }
    .event-tabs-wrap::-webkit-scrollbar { display: none; }
    .event-tabs { display: flex; gap: 8px; }
    .event-tab { height: 48px; padding: 0 20px; border-radius: 32px; border: 1px solid var(--brand-90); background: var(--brand-100); color: var(--brand-70); font-family: inherit; font-size: 20px; font-weight: 274; line-height: 26px; cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
    .event-tab.active { border-radius: 40px; border-color: var(--brand-80); background: var(--brand-105); color: var(--brand-00); }
    .event-tab:not(.active):hover { color: var(--brand-50); }
    .event-detail-body { flex: 1; overflow-y: auto; padding-top: 32px; }
    .event-pane { display: none; width: 100%; }
    .event-pane.active { display: block; }
    .event-pane .req-list { max-width: 770px; margin: 0 auto; padding-top: 0; }
    .event-pane .battle-form { padding: 0; }
    .event-detail-body { width: 100%; }
    .event-form { max-width: 770px; margin: 0 auto; padding: 0 24px 160px; display: flex; flex-direction: column; gap: 16px; }
    .event-footer { flex-shrink: 0; padding: 24px; background: var(--bg); box-shadow: 0 -12px 24px rgba(17,18,16,0.9); }
    .event-footer-inner { max-width: 770px; margin: 0 auto; }
    .btn-delete-event { background: var(--brand-90); border: 1px solid var(--red); border-radius: 8px; color: var(--red); font-family: inherit; font-size: 18px; font-weight: 300; height: 56px; width: 100%; cursor: pointer; transition: all 0.15s; }
    .btn-delete-event:hover { background: var(--red); color: var(--brand-00); }
    @media (min-width: 768px) {
      .event-header { padding: 20px 32px; }
      .event-tabs-wrap { padding: 24px 32px; }
    }

  </style>
</head>

<!-- ══════════════════════════════════════════════
     LOGIN
══════════════════════════════════════════════ -->
<div id="login-screen" class="login-wrap">

══════════════════════════════════════════════ -->

     EDIT OVERLAY

<div id="event-screen" class="event-screen">

  <!-- Header -->
  <header class="event-header">

      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Scrollable content -->
  <div class="event-detail-body">

    <!-- Info tab -->
    <div class="event-pane active" data-pane="info">
      <div class="event-form">
        <div class="edit-field">
          <label class="edit-label" data-i18n="form.gig.venue.label">Venue*</label>
          <input class="edit-input" type="text" id="ev-venue" placeholder="Buvette Chez Simone">
        </div>

      sessionStorage.setItem('momo_admin_token', pat);
      showAdmin();
    } else {
      token = '';
      loginError.textContent = res.status === 401
        ? 'Invalid token — check it has repo scope.'
        : `GitHub error ${res.status}.`;
    }
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign In';
  }

  async function showAdmin() {

  function slugify(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24)
      + '-' + Date.now().toString(36);
  }

  // Stable event slug — no timestamp, based on venue + date
  function eventSlug(venue, date) {
    const v = (venue || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 28);
    const d = (date || '').slice(0, 10); // YYYY-MM-DD
    return [v, d].filter(Boolean).join('-').replace(/-{2,}/g, '-');
  }

  // Build the full request page URL for an event slug
  function requestUrl(slug) {
    return `https://momoauxplatines.ca/requests?event=${encodeURIComponent(slug)}`;
  }

  function loadRegistries() {
    // Reviews
    const rReg = (copyData['en']['reviews.registry'] || '').split('|').filter(Boolean);
    rReg.forEach(id => {
      if (REVIEWS.find(r => r.id === id)) return;
      REVIEWS.push({ id,
        name:      copyData['en'][`reviews.${id}.name`]      || id,
        venue:     copyData['en'][`reviews.${id}.venue`]     || '',
        instagram: copyData['en'][`reviews.${id}.instagram`] || '',
        avatar:    copyData['en'][`reviews.${id}.avatar`]    || '',
        textKey:  `reviews.${id}.text`
      });
    });
    // Demos
    const dReg = (copyData['en']['demos.registry'] || '').split('|').filter(Boolean);
    dReg.forEach(id => {
      if (DEMOS.find(d => d.id === id)) return;
      DEMOS.push({ id,
        title:  copyData['en'][`demos.${id}.title`]  || id,
        thumb:  copyData['en'][`demos.${id}.avatar`] || '',

        descKey: `demos.${id}.desc`

    Object.keys(TIMELINE).forEach(decade => {

      tReg.forEach(id => {

          dates:     copyData['en'][`timeline.${id}.dates`]     || '',

  // ── Load copy ───────────────────────────────────────────────────────────────
  async function loadAllCopy() {
    await Promise.all(['en', 'fr'].map(async lang => {
      if (copyData[lang]) return;
      if (!IS_LOCAL) {
        // Production: load from Blob API
        try {
          const res = await fetch(`/api/copy?lang=${lang}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) { copyData[lang] = await res.json(); return; }
        } catch {}
      }
      // Localhost or API failure: fall back to GitHub Contents API
      const res = await ghFetch(`/repos/${REPO}/contents/copy/${lang}.json?ref=${BRANCH}`);
      if (!res.ok) { copyData[lang] = {}; return; }
      const j = await res.json();
      copySha[lang] = j.sha;
      copyData[lang] = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, '')))));
    }));
  }

  function copy(key) {
    return (copyData[currentLang] || {})[key] || (copyData['en'] || {})[key] || '';
  }

  async function saveCopy(lang, message) {
    if (!IS_LOCAL) {
      // Production: save to Blob via API (no deploy triggered)
      const res = await fetch(`/api/copy?lang=${lang}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify(copyData[lang])
      });
      if (!res.ok) throw new Error(`API ${res.status}`);
    } else {
      // Localhost: save to GitHub (triggers deploy on push)
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(copyData[lang], null, 2))));
      const res = await ghFetch(`/repos/${REPO}/contents/copy/${lang}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, content, sha: copySha[lang], branch: BRANCH })
      });
      if (!res.ok) throw new Error(`GitHub ${res.status}`);
      const data = await res.json();
      copySha[lang] = data.content.sha;
    }
    copyBroadcast?.postMessage({ lang, data: copyData[lang] });
  }

  // ── Load events ──────────────────────────────────────────────────────────────
  async function loadEvents() {
    if (!IS_LOCAL) {
      // Production: load from Blob API
      try {
        const res = await fetch('/api/events', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          currentEvents = Array.isArray(data) ? data : (data.events || []);
          return;
        }
      } catch {}
    }
    // Localhost or API failure: fall back to GitHub Contents API
    const res = await ghFetch(`/repos/${REPO}/contents/events.json?ref=${BRANCH}`);
    if (!res.ok) return;
    const data = await res.json();
    eventsSha = data.sha;
    const content = JSON.parse(atob(data.content.replace(/\n/g, '')));
    currentEvents = Array.isArray(content) ? content : (content.events || []);
  }

  async function saveEvents(message) {
    const body = JSON.stringify({ events: currentEvents }, null, 2);
    if (!IS_LOCAL) {
      // Production: save to Blob via API (no deploy triggered)
      const res = await fetch('/api/events', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body
      });
      if (!res.ok) throw new Error(`API ${res.status}`);
    } else {
      // Localhost: save to GitHub
      const res = await ghFetch(`/repos/${REPO}/contents/events.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message, content: btoa(unescape(encodeURIComponent(body))),
          sha: eventsSha, branch: BRANCH
        })
      });
      if (!res.ok) throw new Error(`GitHub ${res.status}`);
      const data = await res.json();
      eventsSha = data.content.sha;
    }
  }

  // Schedule a one-shot re-render at the next significant event boundary
  // (live event end, or next upcoming event start) — no polling needed
  let _gigTimer = null;
  function scheduleGigRefresh() {
    clearTimeout(_gigTimer);
    const now = Date.now();
    const boundaries = [];
    for (const ev of currentEvents) {
      if (!ev.date || !ev.start_time || !ev.end_time) continue;
      const startMs = new Date(`${ev.date}T${ev.start_time}:00`).getTime();
      let endDateStr = ev.date;
      if (ev.end_time <= ev.start_time) {
        const d = new Date(ev.date); d.setDate(d.getDate() + 1);
        endDateStr = d.toISOString().slice(0, 10);
      }
      const endMs = new Date(`${endDateStr}T${ev.end_time}:00`).getTime();
      if (startMs > now) boundaries.push(startMs); // upcoming → becomes live
      if (endMs   > now) boundaries.push(endMs);   // live → disappears
    }
    if (!boundaries.length) return;
    const next = Math.min(...boundaries);
    _gigTimer = setTimeout(() => { renderLive(); renderGigs(); scheduleGigRefresh(); }, next - now + 1000);
  }

  // ── LIVE section ──────────────────────────────────────────────────────────────
  function renderLive() {
    const el = document.getElementById('live-content');
    const now = Date.now();
    const liveEvent = currentEvents.find(ev => {
      const startMs = new Date(`${ev.date}T${ev.start_time}:00`).getTime();
      if (startMs > now) return false;
      let endDateStr = ev.date;
      if (ev.end_time <= ev.start_time) {
        const d = new Date(ev.date); d.setDate(d.getDate() + 1);
        endDateStr = d.toISOString().slice(0, 10);
      }
      const endMs = new Date(`${endDateStr}T${ev.end_time}:00`).getTime();
      return now <= endMs;
    });

    if (!liveEvent) {
      el.innerHTML = `<div class="empty-state">${t('live.not.live')}</div>`;
      return;
    }

    const liveIdx = currentEvents.indexOf(liveEvent);
    el.innerHTML = `
      <div class="gig-card gig-card--link" data-action="open-requests" data-index="${liveIdx}">
        <div class="gig-card-top" style="pointer-events:none;">
          <div class="gig-card-avatar">

  // ── NEXT GIGS + PAST GIGS sections ───────────────────────────────────────────
  function isGigPast(ev) {
    if (!ev.date || !ev.end_time) return false;
    let endDateStr = ev.date;
    if (ev.start_time && ev.end_time <= ev.start_time) {
      const d = new Date(ev.date); d.setDate(d.getDate() + 1);
      endDateStr = d.toISOString().slice(0, 10);
    }
    return Date.now() > new Date(`${endDateStr}T${ev.end_time}:00`).getTime();
  }

  function buildGigCard(ev, idx) {
    const imgSrc = ev.image ? '../' + ev.image.replace(/^\//, '') : '';
    const card = document.createElement('div');
    card.className = 'gig-card gig-card--link';
    card.dataset.action = 'edit-gig';
    card.dataset.index = String(idx);
    card.innerHTML = `
      <div class="gig-card-top" style="pointer-events:none;">
        <div class="gig-card-avatar">
          <img src="${imgSrc}" alt="${esc(ev.venue)}" onerror="this.style.opacity='0'">
        </div>
        <div class="gig-card-copy">
          <p class="gig-card-name">${esc(ev.venue || '—')}</p>
          <p class="gig-card-meta">${esc(ev.date || '')}</p>
          <p class="gig-card-meta">${esc(ev.start_time || '')}–${esc(ev.end_time || '')}</p>
        </div>
      </div>
      <div class="gig-card-actions" style="pointer-events:none;">
        ${ev.slug ? `<button class="btn-card-edit" data-action="copy-url" data-url="${esc(requestUrl(ev.slug))}" style="pointer-events:auto; text-transform:none;">${t('btn.copyurl')}</button>` : ''}
      </div>`;
    return card;
  }

  function renderGigs() {
    const el          = document.getElementById('gigs-list');
    const pastEl      = document.getElementById('past-gigs-list');
    const pastSection = document.getElementById('past-gigs-section');
    const now         = Date.now();

    const upcoming = [];
    const past     = [];
    for (const ev of currentEvents) {
      if (!ev.date) continue; // dateless test entries — skip
      if (isGigPast(ev)) {
        past.push(ev);
      } else {
        const startMs = new Date(`${ev.date}T${ev.start_time}:00`).getTime();
        if (startMs > now) upcoming.push(ev); // currently-live handled by renderLive()
      }
    }
    upcoming.sort((a, b) => new Date(`${a.date}T${a.start_time}:00`) - new Date(`${b.date}T${b.start_time}:00`));
    past.sort((a, b) => new Date(`${b.date}T${b.start_time}:00`) - new Date(`${a.date}T${a.start_time}:00`)); // most recent first

    // Upcoming
    el.innerHTML = '';
    if (!upcoming.length) {
      el.innerHTML = `<div class="empty-state">${t('no.gigs')}</div>`;
    } else {
      upcoming.forEach(ev => el.appendChild(buildGigCard(ev, currentEvents.indexOf(ev))));
    }

    // Past
    if (!past.length) {
      pastSection.style.display = 'none';
    } else {
      pastSection.style.display = '';
      pastEl.innerHTML = '';
      past.forEach(ev => pastEl.appendChild(buildGigCard(ev, currentEvents.indexOf(ev))));
    }
  }

  // ── DEMOS section ─────────────────────────────────────────────────────────────
  function getDemoDisplayOrder() {
    // Always cross-check against the registry so deleted demos never resurface
    const reg = new Set((copy('demos.registry') || '').split('|').filter(Boolean));
    const orderStr = copy('demos.order');
    if (orderStr) return orderStr.split('|').filter(id => reg.has(id));
    // Legacy fallback: available (reversed) then coming-soon — registry-gated
    const avail = DEMOS.filter(d => reg.has(d.id) && !(copy(`demos.${d.id}.coming-soon`) === 'true' || (!d.ytId && copy(`demos.${d.id}.coming-soon`) !== 'false')));
    const soon  = DEMOS.filter(d => reg.has(d.id) &&  (copy(`demos.${d.id}.coming-soon`) === 'true' || (!d.ytId && copy(`demos.${d.id}.coming-soon`) !== 'false')));
    return [...avail.reverse(), ...soon].map(d => d.id);
  }

  function renderDemos() {
    const el = document.getElementById('demos-list');
    el.innerHTML = '';
    const orderedIds = getDemoDisplayOrder();
    const ordered = orderedIds.map(id => DEMOS.find(d => d.id === id)).filter(Boolean);
    // Append any demos not yet in the order (safety net for newly added items)
    DEMOS.forEach(d => { if (!orderedIds.includes(d.id)) ordered.push(d); });
    ordered.forEach(d => {
      const card = document.createElement('div');
      card.className = 'admin-card';
      const dTitle = copy(`demos.${d.id}.title`) || d.title;
      const dLink  = copy(`demos.${d.id}.link`)  || (d.ytId ? `https://www.youtube.com/watch?v=${d.ytId}` : '');
      const dSoon  = copy(`demos.${d.id}.coming-soon`) === 'true' || (!d.ytId && copy(`demos.${d.id}.coming-soon`) !== 'false');
      card.innerHTML = `
        <div class="card-thumb">
          <img class="card-thumb-img" src="${copy('demos.' + d.id + '.avatar') || d.thumb}" alt="${esc(dTitle)}">
        </div>
        <p class="card-name">${esc(dTitle)}</p>
        <p class="card-text">${esc(copy(d.descKey))}</p>
        ${dSoon ? `<p class="card-sub">${t('card.coming.soon')}</p>` : dLink ? `<p class="card-link-text">${t('card.youtube')}</p>` : ''}
        <button class="btn-card-edit" data-action="edit-demo" data-id="${d.id}">${t('btn.edit')}</button>`;
      el.appendChild(card);
    });
  }

    const { action, id, index, decade } = btn.dataset;
    if (action === 'edit-intro')    openForm('intro');

    if (action === 'edit-demo')     openForm('demo',     DEMOS.find(d => d.id === id));
    if (action === 'delete-demo')   deleteDemo(id);
    if (action === 'edit-timeline') openForm('timeline', { item: TIMELINE[decade]?.find(x => x.id === id), decade });

    if (action === 'delete-gig')    deleteGig(parseInt(index));
    if (action === 'open-requests') openRequests(parseInt(index));

      e.stopPropagation();
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        btn.textContent = t('btn.copied');

          } else if (blobUrl) {

          // Non-text: always both languages

          copyData[lang][`reviews.${id}.venue`]     = venueVal;

        if (!title) { showToast(t('toast.title.required'), 'error'); saveBtn.disabled = false; saveBtn.textContent = t('btn.save'); return; }
        const id = isNew ? slugify(title) : editFormMeta.id;

        // Upload thumbnail → Netlify Blob (no deploy needed)
        const imgInput = document.getElementById('ef-img-input');
        let blobUrl = null;
        if (imgInput?.files[0]) {
          const blobKey = `demos/${id}.jpg`;
          blobUrl = await uploadImageToBlob(imgInput.files[0], blobKey);
        }

        const descVal = document.getElementById('ef-desc')?.value ?? '';
        const ytVal   = document.getElementById('ef-ytlink')?.value ?? '';
        const soonVal = document.getElementById('ef-coming-soon')?.checked ? 'true' : 'false';

        // Auto-translate description for new entries
        let translatedDesc = descVal;
        if (isNew && descVal) {
          saveBtn.textContent = t('btn.translating');
          const otherLang = currentLang === 'en' ? 'fr' : 'en';
          translatedDesc = await autoTranslate(descVal, currentLang, otherLang);
          saveBtn.textContent = t('btn.saving');
        }

        const existingThumb = isNew ? (blobUrl || '') : (copy(`demos.${id}.avatar`) || editFormMeta.thumb || '');
        // Compute new display order with the chosen position
        const newPos = parseInt(document.getElementById('ef-position')?.value) || 1;
        let newOrder = getDemoDisplayOrder();
        if (isNew) {
          newOrder.splice(newPos - 1, 0, id);
        } else {
          const oldIdx = newOrder.indexOf(id);
          if (oldIdx >= 0) newOrder.splice(oldIdx, 1);
          newOrder.splice(newPos - 1, 0, id);
        }
        const orderStr = newOrder.join('|');
        for (const lang of ['en', 'fr']) {
          if (!copyData[lang]) continue;
          if (isNew) {
            const reg = (copyData[lang]['demos.registry'] || '').split('|').filter(Boolean);
            if (!reg.includes(id)) copyData[lang]['demos.registry'] = [...reg, id].join('|');
            copyData[lang][`demos.${id}.avatar`] = existingThumb;
          } else if (blobUrl) {
            copyData[lang][`demos.${id}.avatar`] = blobUrl;
          }
          // Non-text: always both languages
          copyData[lang][`demos.${id}.link`]        = ytVal;
          copyData[lang][`demos.${id}.coming-soon`] = soonVal;
          copyData[lang]['demos.order']             = orderStr;
          // Text: translate on creation, only update active language on edit
          if (isNew) {
            copyData[lang][`demos.${id}.title`] = title;
            copyData[lang][`demos.${id}.desc`]  = (lang !== currentLang) ? translatedDesc : descVal;
          } else if (lang === currentLang) {
            copyData[lang][`demos.${id}.title`] = title;
            copyData[lang][`demos.${id}.desc`]  = descVal;
          }
          await saveCopy(lang, `${isNew ? 'Add' : 'Update'} demo: ${title} (${lang})`);
        }
        const finalThumb = blobUrl || existingThumb;
        if (isNew) {
          DEMOS.push({ id, title, thumb: finalThumb, ytId: '', descKey: `demos.${id}.desc` });
        } else {
          const d = DEMOS.find(x => x.id === id);
          if (d) { d.title = title; if (blobUrl) d.thumb = blobUrl; }
        }
        renderDemos();
        showToast(isNew ? t('toast.demo.added') : t('toast.demo.saved'), 'success');
      }

      if (editFormType === 'timeline' && editFormMeta) {
        const item  = editFormMeta.item;
        const isNew = !item;
        const decade = editFormMeta.decade;
        const name  = document.getElementById('ef-name')?.value.trim();
        if (!name) { showToast(t('toast.title.required'), 'error'); saveBtn.disabled = false; saveBtn.textContent = t('btn.save'); return; }
        const id = isNew ? slugify(name) : item.id;

        // Upload avatar → Netlify Blob (no deploy needed)
        const imgInput = document.getElementById('ef-img-input');
        let blobUrl = null;
        if (imgInput?.files[0]) {
          const blobKey = `timeline/${id}.jpg`;
          blobUrl = await uploadImageToBlob(imgInput.files[0], blobKey);
        }

        const roleVal  = document.getElementById('ef-role')?.value ?? '';
        const datesVal = document.getElementById('ef-dates')?.value ?? '';
        const linkVal  = document.getElementById('ef-link')?.value ?? '';

        // Auto-translate description for new entries
        let translatedRole = roleVal;
        if (isNew && roleVal) {
          saveBtn.textContent = t('btn.translating');
          const otherLang = currentLang === 'en' ? 'fr' : 'en';
          translatedRole = await autoTranslate(roleVal, currentLang, otherLang);
          saveBtn.textContent = t('btn.saving');
        }

        const existingAvatar = isNew ? (blobUrl || '') : (copy(`timeline.${id}.avatar`) || item.avatar || '');
        for (const lang of ['en', 'fr']) {
          if (!copyData[lang]) continue;
          if (isNew) {
            const reg = (copyData[lang][`timeline.${decade}.registry`] || '').split('|').filter(Boolean);
            if (!reg.includes(id)) copyData[lang][`timeline.${decade}.registry`] = [...reg, id].join('|');
            copyData[lang][`timeline.${id}.avatar`] = existingAvatar;
          } else if (blobUrl) {
            copyData[lang][`timeline.${id}.avatar`] = blobUrl;
          }
          // Non-text: always both languages
          copyData[lang][`timeline.${id}.name`]      = name;
          copyData[lang][`timeline.${id}.dates`]     = datesVal;
          copyData[lang][`timeline.${id}.instagram`] = linkVal;
          // Text: translate on creation, only update active language on edit
          if (isNew) {
            copyData[lang][`timeline.${id}.desc`] = (lang !== currentLang) ? translatedRole : roleVal;
          } else if (lang === currentLang) {
            copyData[lang][`timeline.${id}.desc`] = roleVal;
            if (item.roleKey) copyData[lang][item.roleKey] = roleVal;
          }
          await saveCopy(lang, `${isNew ? 'Add' : 'Update'} timeline: ${name} (${lang})`);
        }
        const finalAvatar = blobUrl || existingAvatar;
        if (isNew) {
          TIMELINE[decade].push({ id, name, dates: datesVal, instagram: linkVal, avatar: finalAvatar, roleKey: `timeline.${id}.desc` });
        } else {
          item.name = name; item.dates = datesVal; item.instagram = linkVal; if (blobUrl) item.avatar = blobUrl;
        }
        renderTimeline();
        showToast(isNew ? t('toast.entry.added') : t('toast.entry.saved'), 'success');
      }

      if (editFormType === 'gig') {
        const venue = document.getElementById('ef-venue')?.value.trim();
        if (!venue) { showToast(t('toast.venue.required'), 'error'); saveBtn.disabled = false; saveBtn.textContent = t('btn.save'); return; }

        let imagePath = document.getElementById('ef-image')?.value.trim() || '';
        const igInput     = document.getElementById('ef-instagram');
        const igVal       = igInput?.value.trim() || '';
        const twitchVal   = document.getElementById('ef-twitch')?.value.trim() || '';
        if (pendingCustomFile) {
          try {
            const key = `events/${slugify(venue)}.jpg`;
            imagePath = await uploadImageToBlob(pendingCustomFile, key);
            pendingCustomFile = null;
          } catch (e) { showToast(t('toast.img.failed') + e.message, 'error'); }
        } else if (pendingAvatarUrl && pendingAvatarUser) {
          try {
            imagePath = await uploadAvatarToBlob(pendingAvatarUrl, pendingAvatarUser);
          } catch (_) { imagePath = ''; }
        }

        const dateVal = document.getElementById('ef-date')?.value || '';
        const existingEv = (() => { const i = parseInt(document.getElementById('ef-gig-index')?.value); return i >= 0 ? currentEvents[i] : null; })();
        const slug = existingEv?.slug || eventSlug(venue, dateVal);

        const ev = {
          slug,
          venue,
          address:    document.getElementById('ef-address')?.value.trim() || '',
          date:       dateVal,
          start_time: document.getElementById('ef-start')?.value || '',
          end_time:   document.getElementById('ef-end')?.value || '',
          instagram:  igVal,
          twitch:     twitchVal,
          image:      imagePath,
          show:       document.getElementById('ef-show-toggle')?.classList.contains('on') ?? true,
        };

        const idx = parseInt(document.getElementById('ef-gig-index')?.value);
        const isNew = idx < 0;
        const newIdx = isNew ? currentEvents.length : idx; // capture before push
        if (isNew) currentEvents.push(ev);
        else currentEvents[idx] = ev;

        await saveEvents(isNew ? `Add gig: ${venue}` : `Update gig: ${venue}`);
        renderLive();
        renderGigs();
        scheduleGigRefresh();
        showToast(`"${venue}" ${isNew ? t('toast.entry.added').toLowerCase() : t('toast.entry.saved').toLowerCase()}`, 'success');

        if (isNew) _openEventIdx = newIdx; // set flag — navigation happens after closeForm()
      }

      closeForm();
    } catch (e) {
      showToast(t('toast.save.failed') + e.message, 'error');
    }
    saveBtn.disabled = false;
    saveBtn.textContent = t('btn.save');

    // Navigate to event detail page after popup closes (new gig only)
    if (_openEventIdx >= 0) openEventDetail(_openEventIdx);
  });

  // ── Delete demo ───────────────────────────────────────────────────────────────
  async function deleteDemo(id) {
    const d = DEMOS.find(x => x.id === id);
    if (!confirm(`Delete "${d?.title || id}"?\nThis cannot be undone.`)) return;
    // Close immediately after confirmation — saves happen in the background
    closeForm();
    // Remove from in-memory array
    const idx = DEMOS.findIndex(x => x.id === id);
    if (idx >= 0) DEMOS.splice(idx, 1);
    renderDemos();
    try {
      // Remove from registry and all copy keys for both languages.
      // Tombstone prevents static-seed merge in copy.mjs from re-surfacing
      // demos that originated from the static JSON files.
      for (const lang of ['en', 'fr']) {
        if (!copyData[lang]) continue;
        copyData[lang]['demos.registry'] = (copyData[lang]['demos.registry'] || '')
          .split('|').filter(Boolean).filter(x => x !== id).join('|');
        copyData[lang]['demos.order'] = (copyData[lang]['demos.order'] || '')
          .split('|').filter(Boolean).filter(x => x !== id).join('|');
        Object.keys(copyData[lang]).forEach(k => {
          if (k.startsWith(`demos.${id}.`)) delete copyData[lang][k];
        });
        copyData[lang][`demos.${id}.deleted`] = 'true';
        await saveCopy(lang, `Delete demo: ${id} (${lang})`);
      }
      showToast(`"${d?.title || id}" ${t('toast.deleted')}`, 'success');
    } catch (e) {
      showToast(t('toast.delete.failed') + e.message, 'error');
      // Restore on failure
      loadAllCopy().then(() => { loadRegistries(); renderDemos(); });
    }
  }

  // ── Delete gig ────────────────────────────────────────────────────────────────
  async function deleteGig(index) {
    const ev = currentEvents[index];
    if (!confirm(`Delete "${ev.venue}"?\nThis cannot be undone.`)) return;
    currentEvents.splice(index, 1);
    try {
      await saveEvents(`Delete gig: ${ev.venue}`);
      closeForm();
      renderLive();
      renderGigs();
      showToast(`"${ev.venue}" ${t('toast.deleted')}`, 'success');
    } catch (e) {
      showToast(t('toast.delete.failed') + e.message, 'error');
      loadEvents().then(() => { renderLive(); renderGigs(); });
    }
  }

  // ── Instagram avatar ──────────────────────────────────────────────────────────
  let pendingAvatarUrl = null;
  let pendingAvatarUser = null;
  let pendingCustomFile = null;

  function extractIgUsername(url) {
    const m = (url || '').match(/instagram\.com\/([^/?#]+)/);
    return m ? m[1].replace(/\/$/, '') : null;
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function uploadImageToGitHub(file, repoPath, message) {
    const base64 = (await blobToBase64(file)).split(',')[1];
    const check  = await ghFetch(`/repos/${REPO}/contents/${repoPath}`);
    const body   = { message, content: base64, branch: BRANCH };
    if (check.ok) body.sha = (await check.json()).sha;
    const up = await ghFetch(`/repos/${REPO}/contents/${repoPath}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if (!up.ok) throw new Error(`Image upload failed: ${up.status}`);
  }

  async function uploadAvatarToGitHub(avatarUrl, username) {
    const res = await fetch(avatarUrl);
    if (!res.ok) throw new Error('Fetch failed');
    const blob = await res.blob();
    const dataUrl = await blobToBase64(blob);
    const base64 = dataUrl.split(',')[1];
    const ext = blob.type.includes('png') ? 'png' : 'jpg';
    const path = `images/events/${username}.${ext}`;
    let sha;
    const check = await ghFetch(`/repos/${REPO}/contents/${path}`);
    if (check.ok) sha = (await check.json()).sha;
    const body = { message: `Add venue photo: ${username}`, content: base64, branch: BRANCH };
    if (sha) body.sha = sha;
    const up = await ghFetch(`/repos/${REPO}/contents/${path}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if (!up.ok) throw new Error(`GitHub upload ${up.status}`);
    return `/${path}`;
  }

  // ── Netlify Blob image upload (no deploy needed) ───────────────────────────
  async function uploadImageToBlob(file, key) {
    const res = await fetch(`/api/images?key=${encodeURIComponent(key)}`, {
      method: 'PUT',
      headers: {
        'Content-Type': file.type || 'application/octet-stream',
        'Authorization': `Bearer ${token}`,
      },
      body: file,
    });
    if (!res.ok) throw new Error(`Blob upload failed: ${res.status}`);
    return `/api/images?key=${encodeURIComponent(key)}`;
  }

  async function uploadAvatarToBlob(avatarUrl, username) {
    const res = await fetch(avatarUrl);
    if (!res.ok) throw new Error('Avatar fetch failed');
    const blob = await res.blob();
    const ext = blob.type.includes('png') ? 'png' : 'jpg';
    const key = `events/${username}.${ext}`;
    return uploadImageToBlob(blob, key);
  }

  // ── Auto-translate (MyMemory — free, no key needed) ───────────────────────
  async function autoTranslate(text, fromLang, toLang) {
    if (!text || !text.trim()) return text;
    try {
      const langPair = `${fromLang}|${toLang}`;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}&de=cue.city@gmail.com`;
      const res = await fetch(url);
      if (!res.ok) return text;
      const data = await res.json();
      if (data.responseStatus === 200 && data.responseData?.translatedText) {
        return data.responseData.translatedText;
      }
    } catch (_) {}
    return text; // fallback silencieux si l'API est indisponible
  }

  function showAvatarPreview(username, existingImagePath) {
    const wrap   = document.getElementById('ig-preview-wrap');
    const img    = document.getElementById('ig-preview-img');
    const name   = document.getElementById('ig-preview-name');
    const status = document.getElementById('ig-preview-status');
    if (!wrap) return;
    if (existingImagePath) {
      img.src = '../' + existingImagePath.replace(/^\//, '');
      name.textContent   = username || '';
      status.textContent = 'Current venue photo';
      status.className   = 'ig-preview-status';
      wrap.classList.add('visible');
      pendingAvatarUrl = null; pendingAvatarUser = null;
      return;
    }
    if (!username) { wrap.classList.remove('visible'); return; }
    const avatarUrl = `https://unavatar.io/instagram/${username}`;
    img.src = avatarUrl;
    img.onerror = () => { status.textContent = 'Could not load photo.'; status.className = 'ig-preview-status err'; };
    img.onload  = () => { status.textContent = 'Photo will be saved on save.'; status.className = 'ig-preview-status ok'; };
    name.textContent = '@' + username;
    wrap.classList.add('visible');
    pendingAvatarUrl = avatarUrl; pendingAvatarUser = username;

  // ── Requests ──────────────────────────────────────────────────────────────────
  const reqOverlay  = document.getElementById('req-overlay');
  const reqBody     = document.getElementById('req-body');
  const liveTabsRow = document.getElementById('live-tabs-row');
  let reqList = [];
  let reqEventIdx = -1;
  let reqEventIsLive = false;
  let liveActiveTab = 'played'; // 'played' | 'requests' | 'battle' | 'messages'
  let nowPlayingTrackId = null; // Serato track ID currently marked as now-playing
  let liveTracksCache = []; // Serato tracks fetched for the live view
  let liveTrackSig = ''; // signature to detect new tracks
  let _livePollingTimer = null; // auto-refresh interval for JOUÉES tab

  function isEventLive(ev) {
    if (!ev || !ev.date) return false;
    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    if (ev.date !== todayStr) return false;
    const nowMins = now.getHours() * 60 + now.getMinutes();
    function toMins(t) { if (!t) return null; const p = t.split(':').map(Number); return p[0] * 60 + (p[1] || 0); }
    const start = toMins(ev.start_time);
    const end   = toMins(ev.end_time);
    if (start === null || end === null) return false;
    return nowMins >= start && nowMins < end;
  }

  function openRequests(idx) {
    reqEventIdx = idx;
    const ev = currentEvents[idx];
    reqEventIsLive = isEventLive(ev);
    const avatarEl = document.getElementById('req-event-avatar-img');
    if (avatarEl) {
      const src = ev?.image ? '../' + ev.image.replace(/^\//, '') : '';
      avatarEl.src = src;
      avatarEl.style.opacity = '';
    }
    reqOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    // Always show tabs — default to Playing
    liveTabsRow.style.display = '';
    battleSongs       = [];
    battleDuration    = 900;
    battleSelectedIds = new Set();
    _battleFromRequests = false;
    liveActiveTab = 'played';
    document.getElementById('live-tab-played').className   = 'live-tab-btn active';
    document.getElementById('live-tab-requests').className = 'live-tab-btn inactive';
    document.getElementById('live-tab-battle').className   = 'live-tab-btn inactive';
    document.getElementById('live-tab-messages').className = 'live-tab-btn inactive';
    loadPlayedTracks();
  }

  function stopLivePolling() {
    clearInterval(_livePollingTimer);
    _livePollingTimer = null;
  }

  function startLivePolling() {
    stopLivePolling();
    if (!reqEventIsLive) return; // only poll during live events
    _livePollingTimer = setInterval(pollPlayedTracks, 15_000);
  }

  function closeRequests() {
    stopLivePolling();
    stopBattleTimers();
    reqOverlay.classList.remove('open');
    document.body.style.overflow = '';
    reqList = [];
    liveTracksCache = [];
    liveTrackSig = '';
    nowPlayingTrackId = null;
    _activeBattle = null;
    battleSelectedIds  = new Set();
    _battleFromRequests = false;
    battleSongs    = [];
    battleDuration = 900;
    // Restore default footer in case battle tab had replaced it
    const footer = document.getElementById('req-footer');
    if (footer && !footer.querySelector('#req-refresh-btn')) {
      footer.innerHTML = `<button class="btn-dark" id="req-refresh-btn">${t('btn.refresh')}</button>`;
    }
  }

  // ── JOUÉES tab: Serato track cards ────────────────────────────────────────────
  async function fetchNowPlayingId(gigDate) {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/now_playing?select=track_id,gig_date&limit=1`,
        { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
      );
      if (!res.ok) return null;
      const rows = await res.json();
      const row  = rows.find(r => r.gig_date === gigDate) || rows[0];
      return row?.track_id || null;
    } catch { return null; }
  }

  async function loadPlayedTracks() {
    reqBody.innerHTML = '<div class="empty-state">Loading…</div>';
    const ev = currentEvents[reqEventIdx];
    const gigDate = ev?.date || '';

    // Fetch Serato tracks and current now-playing in parallel
    const [tracksResult, npId] = await Promise.all([
      fetch(gigDate ? `/api/live?date=${encodeURIComponent(gigDate)}` : '/api/live')
        .then(r => r.ok ? r.json() : null).catch(() => null),
      fetchNowPlayingId(gigDate),
    ]);

    liveTracksCache = tracksResult?.tracks || [];
    liveTrackSig = liveTracksCache.map(t => t.id).sort().join(',');
    // Supabase is authoritative; fall back to localStorage if Supabase returns nothing
    nowPlayingTrackId = npId || localStorage.getItem(`momo_np_${gigDate}`) || null;
    renderTrackCards();
    startLivePolling(); // auto-refresh every 15s while live
  }

  // Silent background poll — only re-renders if tracks changed
  async function pollPlayedTracks() {
    if (liveActiveTab !== 'played') return; // don't fetch if tab not visible
    const ev = currentEvents[reqEventIdx];
    const gigDate = ev?.date || '';
    try {
      const res = await fetch(gigDate ? `/api/live?date=${encodeURIComponent(gigDate)}` : '/api/live');
      if (!res.ok) return;
      const { tracks } = await res.json();
      const newSig = (tracks || []).map(t => t.id).sort().join(',');
      if (newSig === liveTrackSig) return; // nothing new
      liveTracksCache = tracks || [];
      liveTrackSig = newSig;
      renderTrackCards(); // re-render with updated list
    } catch { /* silent — don't disrupt the UI on network hiccup */ }
  }

  function renderTrackCards() {
    reqBody.innerHTML = '';

    if (!liveTracksCache.length) {
      reqBody.innerHTML = `
        <div class="req-empty-body">
          <p>${t('playing.empty')}</p>
          <p style="margin-top:8px;color:var(--brand-80)">${t('playing.empty.hint')}</p>
        </div>`;
      return;
    }

    // Sort: most recent (highest numeric Serato ID) first
    const sorted = [...liveTracksCache].sort((a, b) => {
      const na = parseInt((a.id || '').replace(/\D/g, '')) || 0;
      const nb = parseInt((b.id || '').replace(/\D/g, '')) || 0;
      return nb - na;
    });

    sorted.forEach(t => {
      const state = t.id === nowPlayingTrackId ? 'playing'
                  : (nowPlayingTrackId && sorted.findIndex(x => x.id === nowPlayingTrackId) !== -1
                     && sorted.indexOf(t) > sorted.findIndex(x => x.id === nowPlayingTrackId))
                    ? 'played' : 'unplayed';

      const card = document.createElement('div');
      card.className = 'track-card';

      // Play icon SVG
      const playIcon = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 2.5L13 8L3 13.5V2.5Z" fill="currentColor"/>
      </svg>`;
      // Checkmark SVG
      const checkIcon = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 8L6.5 11.5L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

      const iconColor = state === 'playing' ? '#fff' : state === 'played' ? 'var(--green)' : 'var(--brand-50)';
      const btnIcon   = state === 'played' ? checkIcon : playIcon;
      const btnTitle  = state === 'playing' ? t('playing.now.label') : t('playing.mark.label');
      const btnDisabled = !reqEventIsLive ? 'disabled' : '';

      card.innerHTML = `
        <div class="track-art"></div>
        <div class="track-info">
          <p class="track-title">${escReq(t.title || '—')}</p>
          ${t.artist ? `<p class="track-artist">${escReq(t.artist)}</p>` : ''}
        </div>
        <button class="track-play-btn state-${state}" title="${btnTitle}"
                data-track-action="set-now-playing" data-track-id="${escReq(t.id)}"
                style="color:${iconColor}" ${btnDisabled}>
          ${btnIcon}
        </button>`;

      reqBody.appendChild(card);
    });
  }

  async function setNowPlayingTrack(trackId) {
    const ev = currentEvents[reqEventIdx];
    const track = liveTracksCache.find(t => t.id === trackId);
    if (!track || !ev) return;

    try {
      const res = await fetch('/api/now-playing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          gig_date:   ev.date     || '',
          track_id:   track.id   || '',
