<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ — Momo Aux Platines</title>
  <link rel="canonical" href="https://momoauxplatines.ca/dj">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <meta property="og:title" content="Momo — DJ">
  <meta property="og:description" content="DJ depuis les années 90 — gigs, bio, reviews, demos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://momoauxplatines.ca/dj">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&family=Kalnia:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #000000;
      --brand-30:  #dee4da;
      --brand-80:  #51534e;
      --brand-100: #141513;
      --brand-105: #111210;
      --gap-8:  8px;
      --gap-32: 32px;
      --gap-56: 56px;
      --font-display: 'Kalnia', serif;
      --font-ui: 'Kanit', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: #fff; overflow-x: clip; -webkit-font-smoothing: antialiased; }

    .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; width: 100%; }

    /* ── Shared inner header (back + logo) ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 112px;
      padding: var(--gap-32);
      background: var(--bg);
    }
    .hdr-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px; height: 48px;
      color: #fff;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .hdr-logo {
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .hdr-logo img { height: 48px; width: auto; display: block; }

    .icon { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon-back { width: 28px; height: 28px; }
    .arrow { width: 22px; height: 22px; flex-shrink: 0; }

    /* ── Intro: image (right) + copy ── */
    .dj-intro {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: var(--gap-56);
      padding: var(--gap-32);
    }
    .dj-image { display: flex; justify-content: flex-end; }
    .dj-image img {
      width: 160px;
      height: 320px;
      object-fit: cover;
      display: block;
      background: var(--brand-100);
    }
    .dj-copy {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 23px;
      line-height: 31px;
      text-transform: uppercase;
      color: #fff;
    }
    .dj-copy p { margin: 0; }

    /* ── Nav links ── */
    .dj-nav { display: flex; flex-direction: column; width: 100%; }
    .dj-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap-32);
      height: 80px;
      padding: var(--gap-8) var(--gap-32);
      border-top: 0.5px solid var(--brand-80);
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 27px;
      line-height: 31px;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .dj-link:last-child { border-bottom: 0.5px solid var(--brand-80); }
    .dj-link:hover { background: var(--brand-105); }

    /* ── Tablet / desktop ── */
    @media (min-width: 768px) {
      .dj-intro { flex-direction: row-reverse; align-items: center; gap: var(--gap-56); padding: var(--gap-56) var(--gap-32); }
      .dj-image { justify-content: flex-end; flex: 0 0 auto; }
      .dj-image img { width: 320px; height: 540px; }
      .dj-image picture { display: contents; }
      .dj-copy { flex: 1 1 0; font-size: 34px; line-height: 44px; }
      .dj-link { font-size: 32px; line-height: 36px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="hdr-back" href="/" aria-label="Back / Retour" title="Back / Retour">
        <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 H5 M12 5 L5 12 L12 19"/></svg>
      </a>
      <div class="hdr-logo" id="logo-toggle" role="button" tabindex="0"
           aria-label="Switch language / Changer de langue" title="FR / EN">
        <img src="/images/logo-momo-new.svg" alt="Momo Aux Platines">
      </div>
    </header>

    <main class="dj-intro">
      <div class="dj-image" id="dj-image">
        <picture>
          <source media="(min-width: 768px)" srcset="/images/dj.png">
          <img src="/images/dj-mobile.png" alt="Momo, enfant" width="160" height="320">
        </picture>
      </div>
      <div class="dj-copy" id="dj-copy">
        <p>dj since the 90s</p><p>hip-hop roots</p><p>versatile</p><p>turntablist</p><p>friendly and pro</p>
      </div>
    </main>

    <nav class="dj-nav">
      <a class="dj-link" href="/dj/gigs">
        <span data-key="dj.nav.gigs" data-en="gigs" data-fr="gigs">gigs</span>
        <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="dj-link" href="/dj/bio">
        <span data-key="dj.nav.bio" data-en="bio" data-fr="bio">bio</span>
        <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="dj-link" href="/dj/reviews">
        <span data-key="dj.nav.reviews" data-en="reviews" data-fr="avis">reviews</span>
        <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="dj-link" href="/dj/demos">
        <span data-key="dj.nav.demos" data-en="demos" data-fr="demos">demos</span>
        <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="dj-link" href="/dj/contact">
        <span data-key="dj.nav.contact" data-en="contact" data-fr="contact">contact</span>
        <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
    </nav>

  </div>

  <script>
  let currentLang = (() => { try { return localStorage.getItem('momo-lang') || (/^fr/i.test((navigator.languages&&navigator.languages[0])||navigator.language||'')?'fr':'en'); } catch { return 'en'; } })();
  const COPY = { en: {}, fr: {} };

  function applyLang(lang) {
    const copy = COPY[lang] || {};
    document.querySelectorAll('[data-key]').forEach(el => {
      const val = copy[el.dataset.key];
      el.textContent = val !== undefined ? val
        : lang === 'fr' ? (el.dataset.fr || el.textContent)
        : (el.dataset.en || el.textContent);
    });
    document.querySelectorAll('[data-en]:not([data-key])').forEach(el => {
      el.textContent = lang === 'fr' ? (el.dataset.fr || el.textContent) : el.dataset.en;
    });
    const dc = document.getElementById('dj-copy');
    const introLines = (copy['dj.intro'] || '').split('|').map(s => s.trim()).filter(Boolean);
    if (dc && introLines.length) dc.innerHTML = introLines.map(l => `<p>${l.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]))}</p>`).join('');
    document.documentElement.lang = lang;
    currentLang = lang;
    try { localStorage.setItem('momo-lang', lang); } catch {}
  }

  async function fetchCopy(lang) {
    try { const r = await fetch(`/api/copy?lang=${lang}`); if (r.ok) return r.json(); } catch {}
    try { const r = await fetch(`/copy/${lang}.json`); if (r.ok) return r.json(); } catch {}
    return {};
  }
  function renderIntroImage(img) {
    if (!img) return;
    const el = document.getElementById('dj-image'); if (!el) return;
    const esc = s => (s || '').replace(/"/g, '&quot;');
    const mob = img.replace(/(\.[a-z0-9]+)$/i, '-mobile$1');
    el.innerHTML = `<picture><source media="(min-width:768px)" srcset="${esc(img)}"><img src="${esc(mob)}" alt="Momo, enfant" width="160" height="320" onerror="this.src='${esc(img)}'"></picture>`;
  }
  Promise.all([fetchCopy('en'), fetchCopy('fr')]).then(([en, fr]) => {
    COPY.en = en || {}; COPY.fr = fr || {}; applyLang(currentLang);
    renderIntroImage((COPY.en || {})['dj.image']);
  });
  applyLang(currentLang);

  const logoToggle = document.getElementById('logo-toggle');
  function toggleLang() { applyLang(currentLang === 'fr' ? 'en' : 'fr'); }
  logoToggle.addEventListener('click', toggleLang);
  logoToggle.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLang(); }
  });

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', user => {
      if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
    });
  }
  </script>
</body>
</html>
