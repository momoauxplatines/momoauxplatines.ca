<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why — Momo Aux Platines</title>
  <link rel="canonical" href="https://momoauxplatines.ca/jecours-tudonnes-onaide/why">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;900&family=Kalnia:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#000; --lime:#c5ff55;
      --brand-80:#51534e; --brand-100:#141513;
      --gap-8:8px; --gap-32:32px; --gap-56:56px;
      --font-display:'Kalnia',serif;
      --font-ui:'Kanit',sans-serif;
      --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Helvetica Neue',Arial,sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:#fff; overflow-x:clip; -webkit-font-smoothing:antialiased; }
    .page { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }

    .site-header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; height:112px; padding:var(--gap-32); background:var(--bg); }
    .hdr-back { display:flex; align-items:center; justify-content:center; width:48px; height:48px; color:#fff; }
    .hdr-logo { cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
    .hdr-logo img { height:48px; width:auto; display:block; }
    .icon { stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .icon-back { width:28px; height:28px; }

    .why-intro { display:flex; flex-direction:column; gap:var(--gap-56); padding:var(--gap-32); }
    .why-title { font-family:var(--font-display); font-weight:700; font-size:39px; line-height:39px; text-transform:uppercase; }
    .why-sub { font-family:var(--font-display); font-weight:500; font-size:23px; line-height:31px; text-transform:uppercase; }
    .why-sub p { margin:0; }

    .why-list { display:grid; grid-template-columns:1fr; border-top:0.5px solid var(--brand-80); }
    .why-card {
      display:flex; flex-direction:column; gap:var(--gap-8);
      padding:var(--gap-32);
      border-bottom:0.5px solid var(--brand-80);
    }
    .why-card h2 { font-family:var(--font-display); font-weight:500; font-size:23px; line-height:31px; text-transform:uppercase; color:#fff; }
    .why-card p { font-family:var(--font-body); font-weight:300; font-size:19px; line-height:28px; color:#fff; }

    .why-donate {
      display:flex; align-items:center; justify-content:center; height:56px;
      margin:var(--gap-32);
      background:var(--lime); color:var(--brand-100);
      font-family:var(--font-ui); font-weight:900; font-size:20px; line-height:26px;
      text-transform:uppercase; text-decoration:none;
    }

    @media (min-width:768px) {
      .why-title { font-size:48px; line-height:48px; }
      .why-list { grid-template-columns:1fr 1fr; }
      .why-card:nth-child(odd) { border-right:0.5px solid var(--brand-80); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="hdr-back" href="/jecours-tudonnes-onaide" aria-label="Back / Retour" title="Back / Retour">
        <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 H5 M12 5 L5 12 L12 19"/></svg>
      </a>
      <div class="hdr-logo" id="logo-toggle" role="button" tabindex="0" aria-label="Switch language / Changer de langue" title="FR / EN">
        <img src="/images/logo-momo-new.svg" alt="Momo Aux Platines">
      </div>
    </header>

    <section class="why-intro">
      <h1 class="why-title" id="why-title"></h1>
      <div class="why-sub" id="why-sub"></div>
    </section>

    <main class="why-list" id="why-list"></main>

    <a class="why-donate" id="why-donate" href="https://gofund.me/8a19f1e06" target="_blank" rel="noopener">donate</a>
  </div>

  <script>
  let currentLang = (() => { try { return localStorage.getItem('momo-lang') || 'en'; } catch { return 'en'; } })();
  const COPY = { en: {}, fr: {} };
  const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const lines = s => (s || '').split('|').map(x => x.trim()).filter(Boolean);
  function render() {
    const copy = COPY[currentLang] || COPY.en || {};
    const title = copy['why.title'] || 'why';
    document.getElementById('why-title').textContent = title;
    document.title = title + ' — Momo Aux Platines';
    document.getElementById('why-sub').innerHTML = lines(copy['why.intro']).map(l => `<p>${esc(l)}</p>`).join('');
    const reg = (copy['why.blocks'] || '').split('|').map(s => s.trim()).filter(Boolean).filter(id => copy['why.' + id + '.hidden'] !== 'true');
    document.getElementById('why-list').innerHTML = reg.map(id => {
      const t = copy['why.' + id + '.title'] || ''; const b = copy['why.' + id + '.body'] || '';
      return `<article class="why-card">${t ? `<h2>${esc(t)}</h2>` : ''}${b ? `<p>${esc(b)}</p>` : ''}</article>`;
    }).join('');
    document.getElementById('why-donate').textContent = copy['why.donate'] || 'donate';
    document.documentElement.lang = currentLang;
  }
  function applyLang(lang){ currentLang = lang; try { localStorage.setItem('momo-lang', lang); } catch {} render(); }
  async function fetchCopy(lang){ try { const r = await fetch(`/api/copy?lang=${lang}`); if (r.ok) return r.json(); } catch {} try { const r = await fetch(`/copy/${lang}.json`); if (r.ok) return r.json(); } catch {} return {}; }
  Promise.all([fetchCopy('en'), fetchCopy('fr')]).then(([en, fr]) => { COPY.en = en || {}; COPY.fr = fr || {}; render(); });
  render();
  const logo = document.getElementById('logo-toggle');
  logo.addEventListener('click', () => applyLang(currentLang==='fr'?'en':'fr'));
  logo.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); applyLang(currentLang==='fr'?'en':'fr'); } });
  if (window.netlifyIdentity) { window.netlifyIdentity.on('init', user => { if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; }); }); }
  </script>
</body>
</html>
