<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fund raise — Momo Aux Platines</title>
  <link rel="canonical" href="https://momoauxplatines.ca/jecours-tudonnes-onaide">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <meta property="og:title" content="Je cours. Tu donnes. On aide.">
  <meta property="og:description" content="500 km en novembre pour la recherche contre le cancer.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://momoauxplatines.ca/jecours-tudonnes-onaide">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&family=Kalnia:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #000000;
      --lime:      #c5ff55;
      --brand-30:  #dee4da;
      --brand-60:  #a2a89b;
      --brand-80:  #51534e;
      --brand-90:  #282a27;
      --brand-100: #141513;
      --brand-105: #111210;
      --gap-8:  8px;
      --gap-12: 12px;
      --gap-16: 16px;
      --gap-32: 32px;
      --gap-56: 56px;
      --radius-2:  2px;
      --radius-8:  8px;
      --radius-72: 72px;
      --font-display: 'Kalnia', serif;
      --font-ui: 'Kanit', sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: #fff; overflow-x: clip; -webkit-font-smoothing: antialiased; }
    .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; width: 100%; }

    .site-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; height: 112px; padding: var(--gap-32); background: var(--bg); }
    .hdr-back { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; color: #fff; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .hdr-logo { cursor: pointer; user-select: none; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .hdr-logo img { height: 48px; width: auto; display: block; }
    .icon { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon-back { width: 28px; height: 28px; }
    .arrow { width: 22px; height: 22px; flex-shrink: 0; }

    .fr-intro { flex: 1 1 auto; display: flex; flex-direction: column; gap: var(--gap-56); padding: var(--gap-32); }
    .fr-image { display: flex; justify-content: flex-end; }
    .fr-image picture { display: contents; }
    .fr-image img, .fr-image video { width: 160px; height: 320px; object-fit: cover; object-position: bottom; display: block; background: var(--brand-100); }
    .fr-carousel { display: flex; flex-direction: column; gap: var(--gap-8); }
    .fr-cnav { display: flex; align-items: center; justify-content: space-between; }
    .fr-cbtn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: transparent; border: 0; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .fr-cbtn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fr-cbtn:hover { color: var(--lime); }
    .fr-ccount { font-family: var(--font-body); font-weight: 300; font-size: 15px; line-height: 1; color: var(--brand-30); font-variant-numeric: tabular-nums; }
    .fr-copy { font-family: var(--font-display); font-weight: 500; font-size: 23px; line-height: 31px; text-transform: uppercase; color: #fff; }
    .fr-copy p { margin: 0; }

    /* ── Stat badges (jauges + valeurs) ── */
    .fr-badges { display: flex; flex-direction: column; gap: var(--gap-12); width: 100%; }
    .fr-gauges { display: flex; flex-direction: column; gap: var(--gap-12); }
    .fr-stats  { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-12); }
    .stat-badge {
      display: flex; flex-direction: column; gap: var(--gap-12);
      background: var(--brand-105); border: 0.5px solid var(--brand-80);
      border-radius: 0; padding: var(--gap-16); min-width: 0;
    }
    .stat-value { gap: var(--gap-8); }
    .stat-figure { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; font-family: var(--font-body); }
    .fig-num { font-weight: 700; font-size: 18px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
    .fig-u   { font-weight: 300; font-size: 16px; line-height: 1; color: var(--brand-60); }
    .stat-label {
      font-family: var(--font-ui); font-weight: 600; font-size: 14px; line-height: 1.2;
      text-transform: uppercase; color: #fff;
    }
    .stat-num { font-variant-numeric: tabular-nums; }
    .stat-bar { position: relative; height: 16px; background: var(--brand-90); border-radius: 0; overflow: hidden; }
    .stat-fill { position: absolute; top: 0; left: 0; bottom: 0; width: 0; background: var(--lime); border-radius: 0; }
    .stat-scale {
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-ui); font-weight: 300; font-size: 13px; line-height: 1;
      color: var(--brand-60); font-variant-numeric: tabular-nums;
    }

    .btn-donate {
      display: flex; align-items: center; justify-content: center;
      height: 56px; width: 100%; background: var(--lime); color: var(--brand-100);
      font-family: var(--font-ui); font-weight: 900; font-size: 20px; line-height: 26px;
      text-transform: uppercase; text-decoration: none;
    }

    .fr-nav { display: flex; flex-direction: column; width: 100%; }
    .fr-link {
      display: flex; align-items: center; justify-content: space-between; gap: var(--gap-32);
      height: 80px; padding: var(--gap-8) var(--gap-32);
      border-top: 0.5px solid var(--brand-80);
      font-family: var(--font-display); font-weight: 500; font-size: 27px; line-height: 31px;
      text-transform: uppercase; color: #fff; text-decoration: none; transition: background-color 0.15s ease;
    }
    .fr-link:last-child { border-bottom: 0.5px solid var(--brand-80); }
    .fr-link:hover { background: var(--brand-105); }

    @media (min-width: 768px) {
      .fr-image img, .fr-image video { width: 320px; height: 540px; }
      .fr-copy { font-size: 30px; line-height: 40px; }
      .fr-link { font-size: 32px; line-height: 36px; }
      .fr-gauges { flex-direction: row; }
      .fr-gauges .stat-badge { flex: 1 1 0; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="hdr-back" href="/" aria-label="Back / Retour" title="Back / Retour">
        <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 H5 M12 5 L5 12 L12 19"/></svg>
      </a>
      <div class="hdr-logo" id="logo-toggle" role="button" tabindex="0" aria-label="Switch language / Changer de langue" title="FR / EN">
        <img src="/images/logo-momo-new.svg" alt="Momo Aux Platines">
      </div>
    </header>

    <main class="fr-intro">
      <div class="fr-image" id="fr-media">
        <div class="fr-carousel" id="fr-carousel">
          <div class="fr-cmedia" id="fr-cmedia">
            <video class="fr-video" controls playsinline preload="metadata" poster="/images/fundraise-poster-2.jpg">
              <source src="/images/fundraise-web-2.mp4" type="video/mp4">
            </video>
          </div>
          <div class="fr-cnav" id="fr-cnav" hidden>
            <button class="fr-cbtn" id="fr-prev" type="button" aria-label="Vidéo précédente / Previous video">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>
            </button>
            <span class="fr-ccount" id="fr-ccount">1/1</span>
            <button class="fr-cbtn" id="fr-next" type="button" aria-label="Vidéo suivante / Next video">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="fr-copy" id="fr-copy">
        <p>During november</p><p>run 500km (or more)</p><p>raise 10,000$ (or more)</p><p>help cancer research</p>
      </div>
      <div class="fr-badges">
        <div class="fr-gauges">
          <div class="stat-badge" data-badge="km">
            <div class="stat-label"><span class="stat-num" id="km-num">0</span>&nbsp;<span data-en="km run" data-fr="kms courus">kms courus</span></div>
            <div class="stat-bar"><div class="stat-fill" id="km-fill"></div></div>
            <div class="stat-scale"><span>0</span><span id="km-goal">500</span></div>
          </div>
          <div class="stat-badge" data-badge="don">
            <div class="stat-label"><span class="stat-num" id="don-num">0</span>$&nbsp;<span data-en="raised" data-fr="de dons amassés">de dons amassés</span></div>
            <div class="stat-bar"><div class="stat-fill" id="don-fill"></div></div>
            <div class="stat-scale"><span>0</span><span id="don-goal">5,000</span></div>
          </div>
        </div>
        <div class="fr-stats">
          <div class="stat-badge stat-value">
            <div class="stat-label" data-en="elapsed time" data-fr="temps écoulé">temps écoulé</div>
            <div class="stat-figure" id="time-figure"><span class="fig-u">—</span></div>
          </div>
          <div class="stat-badge stat-value">
            <div class="stat-label" data-en="avg pace" data-fr="allure moyenne">allure moyenne</div>
            <div class="stat-figure" id="pace-figure"><span class="fig-u">—</span></div>
          </div>
        </div>
      </div>
      <a class="btn-donate" href="https://gofund.me/8a19f1e06" target="_blank" rel="noopener"
         data-key="fr.donate" data-en="donate" data-fr="faire un don">donate</a>
    </main>

    <nav class="fr-nav">
      <a class="fr-link" href="/jecours-tudonnes-onaide/why">
        <span data-key="fr.nav.why" data-en="why" data-fr="pourquoi">why</span>
        <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="fr-link" href="/jecours-tudonnes-onaide/runs">
        <span data-key="fr.nav.runs" data-en="runs" data-fr="courses">runs</span>
        <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
      <a class="fr-link" href="/jecours-tudonnes-onaide/donations">
        <span data-key="fr.nav.donations" data-en="donations" data-fr="dons">donations</span>
        <svg class="icon arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7 M8 7 H17 V16"/></svg>
      </a>
    </nav>

  </div>

  <script>
  const KM_GOAL = 500;
  let currentLang = (() => { try { return localStorage.getItem('momo-lang') || (/^fr/i.test((navigator.languages&&navigator.languages[0])||navigator.language||'')?'fr':'en'); } catch { return 'en'; } })();

  const COPY = { en: {}, fr: {} };
  function applyLang(lang) {
    const copy = COPY[lang] || {};
    document.querySelectorAll('[data-key]').forEach(el => {
      const v = copy[el.dataset.key];
      el.textContent = v !== undefined ? v : (lang === 'fr' ? (el.dataset.fr || el.textContent) : (el.dataset.en || el.textContent));
    });
    document.querySelectorAll('[data-en]:not([data-key])').forEach(el => {
      el.textContent = lang === 'fr' ? (el.dataset.fr || el.textContent) : el.dataset.en;
    });
    const fc = document.getElementById('fr-copy');
    const introLines = (copy['fr.intro'] || '').split('|').map(s => s.trim()).filter(Boolean);
    if (fc && introLines.length) fc.innerHTML = introLines.map(l => `<p>${l.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]))}</p>`).join('');
    document.documentElement.lang = lang; currentLang = lang;
    try { localStorage.setItem('momo-lang', lang); } catch {}
  }
  applyLang(currentLang);

  const logoToggle = document.getElementById('logo-toggle');
  function toggleLang() { applyLang(currentLang === 'fr' ? 'en' : 'fr'); }
  logoToggle.addEventListener('click', toggleLang);
  logoToggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLang(); } });

  function fmtInt(n) { return Math.round(n).toLocaleString('fr-CA').replace(/ /g, ' '); }

  // ── Carrousel de vidéos d'intro, éditable depuis l'admin via /api/copy ──
  // Le registre fundraise.videos.registry est ordonné du plus récent au plus ancien.
  const escAttr = s => (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const VIDEO_TYPES = { mov:'video/quicktime', mp4:'video/mp4', m4v:'video/mp4', webm:'video/webm', ogg:'video/ogg' };
  let FR_VIDEOS = [], frIdx = 0;

  function buildVideos(c) {
    const reg = (c['fundraise.videos.registry'] || '').split('|').map(s => s.trim()).filter(Boolean);
    let list = reg
      .map(id => ({ src: c[`fundraise.video.${id}.src`] || '', poster: c[`fundraise.video.${id}.poster`] || '' }))
      .filter(v => v.src);
    // Repli : ancien champ unique
    if (!list.length && c['fundraise.media']) list = [{ src: c['fundraise.media'], poster: c['fundraise.poster'] || '' }];
    return list;
  }
  function slideHtml(v) {
    const ext = (v.src.split('.').pop() || '').toLowerCase();
    if (VIDEO_TYPES[ext]) {
      return `<video class="fr-video" controls playsinline preload="metadata" ${v.poster ? `poster="${escAttr(v.poster)}"` : ''}><source src="${escAttr(v.src)}" type="${VIDEO_TYPES[ext]}"></video>`;
    }
    const mob = v.src.replace(/(\.[a-z0-9]+)$/i, '-mobile$1');
    return `<picture><source media="(min-width:768px)" srcset="${escAttr(v.src)}"><img src="${escAttr(mob)}" alt="Momo en course" width="160" height="320" onerror="this.src='${escAttr(v.src)}'"></picture>`;
  }
  function showSlide(i) {
    if (!FR_VIDEOS.length) return;
    frIdx = (i % FR_VIDEOS.length + FR_VIDEOS.length) % FR_VIDEOS.length;
    const media = document.getElementById('fr-cmedia');
    const count = document.getElementById('fr-ccount');
    const nav   = document.getElementById('fr-cnav');
    if (media) media.innerHTML = slideHtml(FR_VIDEOS[frIdx]);
    if (count) count.textContent = `${frIdx + 1}/${FR_VIDEOS.length}`;
    if (nav)   nav.hidden = FR_VIDEOS.length < 2;
  }
  function renderCarousel(c) {
    FR_VIDEOS = buildVideos(c);
    if (!FR_VIDEOS.length) return;
    showSlide(0);
  }
  document.getElementById('fr-prev').addEventListener('click', () => showSlide(frIdx - 1));
  document.getElementById('fr-next').addEventListener('click', () => showSlide(frIdx + 1));
  async function fetchCopy(lang) {
    try { const r = await fetch(`/api/copy?lang=${lang}`); if (r.ok) return r.json(); } catch {}
    try { const r = await fetch(`/copy/${lang}.json`); if (r.ok) return r.json(); } catch {}
    return {};
  }
  Promise.all([fetchCopy('en'), fetchCopy('fr')]).then(([en, fr]) => {
    COPY.en = en || {}; COPY.fr = fr || {}; applyLang(currentLang);
    renderCarousel(COPY[currentLang] || COPY.en || {});
  });

  // ── Stat badges : jauges animées au scroll (vitesse moyenne) ──
  const DOLLAR_GOAL = 5000;
  const ANIM_MS = 1400; // vitesse moyenne
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const badges = {
    km:  { num: document.getElementById('km-num'),  fill: document.getElementById('km-fill'),  goalEl: document.getElementById('km-goal'),  goal: KM_GOAL,     target: 0, shown: 0, visible: false, anim: null },
    don: { num: document.getElementById('don-num'), fill: document.getElementById('don-fill'), goalEl: document.getElementById('don-goal'), goal: DOLLAR_GOAL, target: 0, shown: 0, visible: false, anim: null },
  };
  // Échelles (max) formatées
  if (badges.km.goalEl)  badges.km.goalEl.textContent  = fmtInt(KM_GOAL);
  if (badges.don.goalEl) badges.don.goalEl.textContent = fmtInt(DOLLAR_GOAL);

  function paint(b, val) {
    b.num.textContent = fmtInt(val);
    b.fill.style.width = (b.goal ? Math.min(100, Math.max(0, val / b.goal * 100)) : 0) + '%';
  }
  function animateBadge(b) {
    if (b.anim) cancelAnimationFrame(b.anim);
    const from = b.shown, to = b.target;
    if (REDUCED || from === to) { b.shown = to; paint(b, to); return; }
    const start = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3); // easeOutCubic
    (function step(now) {
      const t = Math.min(1, (now - start) / ANIM_MS);
      const val = from + (to - from) * ease(t);
      b.shown = val; paint(b, val);
      if (t < 1) b.anim = requestAnimationFrame(step);
      else { b.shown = to; paint(b, to); b.anim = null; }
    })(start);
  }
  function setTarget(key, val) {
    const b = badges[key]; if (!b) return;
    b.target = val;
    if (b.visible) animateBadge(b);
  }

  // Déclenche l'animation quand la carte entre dans la vue
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        const b = badges[en.target.dataset.badge];
        if (b && !b.visible) { b.visible = true; animateBadge(b); }
        io.unobserve(en.target);
      });
    }, { threshold: 0.4 });
    document.querySelectorAll('.stat-badge').forEach(el => io.observe(el));
  } else {
    Object.values(badges).forEach(b => { b.visible = true; animateBadge(b); });
  }

  // Badges valeurs : temps écoulé + allure moyenne (h/m/s, m/s par km)
  function figHtml(parts) {
    return parts.map(([n, u]) => `<span class="fig-num">${n}</span> <span class="fig-u">${u}</span>`).join(' ');
  }
  function renderTime(totalS) {
    let h = Math.floor(totalS / 3600), m = Math.floor((totalS % 3600) / 60), s = Math.round(totalS % 60);
    if (s === 60) { s = 0; m++; } if (m === 60) { m = 0; h++; }
    document.getElementById('time-figure').innerHTML = figHtml([[h, 'h'], [m, 'm'], [s, 's']]);
  }
  function renderPace(paceS) {
    if (!paceS || !isFinite(paceS)) return;
    let m = Math.floor(paceS / 60), s = Math.round(paceS % 60);
    if (s === 60) { s = 0; m++; }
    document.getElementById('pace-figure').innerHTML = figHtml([[m, 'm'], [s, 's']]);
  }

  // Données live
  fetch('/api/strava').then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    if (typeof d.total_km === 'number') setTarget('km', d.total_km);
    // Temps total écoulé (fallback : somme des courses)
    const elapsed = (typeof d.total_elapsed_s === 'number') ? d.total_elapsed_s
      : (Array.isArray(d.runs) ? d.runs.reduce((s, r) => s + (r.elapsed_time_s || r.moving_time_s || 0), 0) : 0);
    if (elapsed > 0) renderTime(elapsed);
    // Allure moyenne par km (fallback : temps en mouvement / km)
    let pace = (typeof d.avg_pace_s_per_km === 'number') ? d.avg_pace_s_per_km : null;
    if (pace == null && Array.isArray(d.runs) && typeof d.total_km === 'number' && d.total_km > 0) {
      const mv = d.runs.reduce((s, r) => s + (r.moving_time_s || 0), 0);
      pace = Math.round(mv / d.total_km);
    }
    if (pace) renderPace(pace);
  }).catch(() => {});
  fetch('/api/dons').then(r => r.ok ? r.json() : null).then(d => {
    if (d && Array.isArray(d.donations)) {
      const total = d.donations.reduce((s, x) => s + (Number(x.amount) || 0), 0);
      setTarget('don', total);
    }
  }).catch(() => {});

  if (window.netlifyIdentity) { window.netlifyIdentity.on('init', user => { if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; }); }); }
  </script>
</body>
</html>
